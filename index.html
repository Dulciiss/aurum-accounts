<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Accounts</title>
    <!-- Importamos la tipografía Cinzel estilo LoL desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #e2e8f0;
            font-family: 'Cinzel', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            align-content: start;
        }
        .sidebar-btn {
            width: 100%;
            padding: 9px 12px;
            background: #111218;
            border: 1px solid #232430;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: 'Cinzel', sans-serif;
        }
        .sidebar-btn:hover {
            background: #1e2029;
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
        }
        .note-input {
            background: #0b0c10;
            border: 1px solid #232430;
            color: #cbd5e1;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .note-input:focus {
            border-color: #3b82f6;
        }

        /* Animación de pulso deslizante de izquierda a derecha para la barra de LP */
        @keyframes lpPulseWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .lp-fill-animated {
            background-size: 200% 100%;
            animation: lpPulseWave 2.5s linear infinite;
        }

        @keyframes cardRadarWave {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.15; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.35; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.15; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rotating-spinner { animation: spin 3s linear infinite; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .neon-toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #111218, #171923);
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.1);
            font-size: 13px;
            font-family: 'Cinzel', sans-serif;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .neon-toast.hiding { animation: fadeOut 0.4s ease forwards; }

        .lang-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: #14151c;
            border: 1px solid #232430;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            width: 140px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
        }
        .lang-option {
            padding: 8px 12px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            transition: 0.2s;
            font-family: 'Cinzel', sans-serif;
        }
        .lang-option:hover {
            background: #1e2029;
            color: #fff;
        }
        .lang-option.active {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="sidebar" style="display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; padding: 15px; background: #0b0c10; border-right: 1px solid #1f2029;">
        <div class="logo-area" style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
            <img src="icon.png" alt="Logo" style="height: 76px; width: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(59,130,246,0.9));">
            <h2 class="title" style="font-size: 13px; color: #fff; letter-spacing: 1px; margin: 0; font-family: 'Cinzel', sans-serif;">LEAGUE ACCOUNTS</h2>
        </div>
        <button class="btn-add" data-i18n="addAccount" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.3); transition: 0.2s; font-family: 'Cinzel', sans-serif;">+ Add account</button>
        
        <div style="margin-top: 15px; background: #111218; border: 1px solid #232430; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 10px;">
            <svg class="rotating-spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2v6h-6"></path>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                <path d="M3 22v-6h6"></path>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            <div style="display: flex; flex-direction: column;">
                <span style="font-size: 9px; color: #6b6c75; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase;" data-i18n="autoRefreshLabel">AUTO REFRESH</span>
                <span id="auto-refresh-timer" style="font-size: 11px; color: #cbd5e1; font-weight: 600;">Next refresh 30s</span>
            </div>
        </div>

        <div class="rank-distribution-panel" style="margin-top: 15px; background: #111218; border: 1px solid #232430; border-radius: 8px; padding: 12px; font-size: 11px; color: #94a3b8;">
            <div data-i18n="rankDistribution" style="font-weight: bold; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Cinzel', sans-serif;">Rank Distribution</div>
            <div id="rank-stats-container" style="display: flex; flex-direction: column; gap: 5px;"></div>
        </div>

        <div class="spacer" style="flex-grow: 1;"></div>

        <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;">
            <button class="sidebar-btn" id="btn-import" data-i18n="importAccounts">📥 Import Accounts</button>
            <button class="sidebar-btn" id="btn-export" data-i18n="exportAccounts">📤 Export Accounts</button>
        </div>

        <button class="btn-menu sidebar-btn" data-i18n="settings" style="background: #161821; color: #cbd5e1;">⚙️ Settings</button>
    </div>
    
    <div class="content-wrapper" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="app-header" style="background-color: #111218; padding: 15px 30px; border-bottom: 1px solid #1f2029; display: flex; align-items: center; justify-content: space-between; gap: 15px;">
            <div class="search-container" style="position: relative; flex: 1; max-width: 350px;">
                <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search name, tag or account ID..." style="width: 100%; background: #0b0c10; border: 1px solid #232430; color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; transition: border-color 0.2s; font-family: 'Cinzel', sans-serif;">
                <span style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #6b6c75; background: #1f2029; padding: 2px 5px; border-radius: 4px;">Ctrl+F</span>
            </div>
            
            <div class="filters-container" style="display: flex; gap: 10px; align-items: center; position: relative;">
                <select id="filter-region" style="background: #0b0c10; border: 1px solid #232430; color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; font-family: 'Cinzel', sans-serif;">
                    <option value="all" data-i18n="allRegions">All regions</option>
                    <option value="euw">EUW</option>
                    <option value="eune">EUNE</option>
                    <option value="na">NA</option>
                    <option value="kr">KR</option>
                </select>

                <select id="sort-select" style="background: #0b0c10; border: 1px solid #232430; color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; font-family: 'Cinzel', sans-serif;">
                    <option value="rank" data-i18n="sortRank">Sort: Rank</option>
                    <option value="name" data-i18n="sortName">Sort: Name</option>
                </select>

                <div style="position: relative;">
                    <button id="lang-btn" title="Language" style="background: #0b0c10; border: 1px solid #232430; color: white; padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 8 6 6"></path>
                            <path d="m4 14 6-6 2-3"></path>
                            <path d="M2 5h12"></path>
                            <path d="M7 2h1"></path>
                            <path d="m22 22-5-10-5 10"></path>
                            <path d="M14 18h6"></path>
                        </svg>
                    </button>
                    <div id="lang-dropdown" class="lang-dropdown">
                        <button class="lang-option" data-lang="es">Español</button>
                        <button class="lang-option" data-lang="en">English</button>
                        <button class="lang-option" data-lang="fr">Français</button>
                        <button class="lang-option" data-lang="de">Deutsch</button>
                        <button class="lang-option" data-lang="pt">Português</button>
                        <button class="lang-option" data-lang="ru">Русский</button>
                        <button class="lang-option" data-lang="tr">Türkçe</button>
                        <button class="lang-option" data-lang="zh">中文</button>
                        <button class="lang-option" data-lang="ja">日本語</button>
                        <button class="lang-option" data-lang="ko">한국어</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content" style="overflow-y: auto; padding: 30px; flex-grow: 1; background: #07080a;">
        </div>
    </div>

    <!-- Modales -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h3 data-i18n="modalAddTitle">ADD ACCOUNT</h3>
            <input type="text" id="login-user" data-i18n-placeholder="loginUserPlaceholder" placeholder="Usuario de Login (Riot)">
            <input type="text" id="riot-id" data-i18n-placeholder="riotIdPlaceholder" placeholder="Riot ID (ej. Nombre#TAG)">
            <div class="input-group" style="margin-bottom: 15px;">
                <label data-i18n="regionLabel" style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-family: 'Cinzel', sans-serif;">Región</label>
                <select id="region" style="width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; font-family: 'Cinzel', sans-serif;">
                    <option value="euw">EUW</option>
                    <option value="eune">EUNE</option>
                    <option value="na">NA</option>
                    <option value="kr">KR</option>
                </select>
            </div>
            <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" placeholder="Contraseña">
            <button id="save-account" class="btn-add" data-i18n="saveBtn">Save</button>
            <button id="close-modal" class="btn-login" data-i18n="cancelBtn" style="margin-top: 10px; width: 100%; font-family: 'Cinzel', sans-serif;">Cancel</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content" style="width: 350px;">
            <h3 data-i18n="settingsTitle">SETTINGS</h3>
            <div style="margin-bottom: 20px; font-size: 13px; color: #94a3b8;">
                <p style="margin-bottom: 12px;"><strong data-i18n="dataPathLabel" style="font-family: 'Cinzel', sans-serif;">Ruta de datos (accounts.json):</strong><br><span id="data-path-label" style="font-size: 11px; color: #38bdf8; word-break: break-all; display: inline-block; margin-top: 4px;"></span></p>
                <p style="margin: 0;"><strong data-i18n="savedAccountsLabel" style="font-family: 'Cinzel', sans-serif;">Cuentas guardadas:</strong> <span id="accounts-count-label" style="color: #fff; font-weight: bold;">0</span></p>
            </div>
            <button id="btn-open-folder" class="btn-login" data-i18n="openFolderBtn" style="margin-bottom: 10px; width: 100%; cursor: pointer; font-family: 'Cinzel', sans-serif;">📂 Abrir carpeta de datos</button>
            <button id="close-settings" class="btn-login" data-i18n="closeBtn" style="width: 100%; cursor: pointer; font-family: 'Cinzel', sans-serif;">Cerrar</button>
        </div>
    </div>

    <div id="confirm-modal" class="modal">
        <div class="modal-content" style="width: 340px; text-align: center;">
            <h3 data-i18n="deleteTitle" style="color: #ef4444; margin-bottom: 10px;">Eliminar cuenta</h3>
            <p id="confirm-text" style="font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; font-family: 'Cinzel', sans-serif;"></p>
            <div style="display: flex; gap: 10px;">
                <button id="confirm-yes" style="flex: 1; padding: 10px; background: #ef4444; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Cinzel', sans-serif;" data-i18n="acceptBtn">Aceptar</button>
                <button id="confirm-no" style="flex: 1; padding: 10px; background: #1e2029; border: 1px solid #334155; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Cinzel', sans-serif;" data-i18n="cancelBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script>
        const fs = require('fs');
        const path = require('path');
        const { exec } = require('child_process');
        const { BrowserWindow, shell, dialog } = require('@electron/remote');

        function getSystemLanguage() {
            const sysLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
            return translations[sysLang] ? sysLang : 'en';
        }

        let currentLang = getSystemLanguage();

        function t(key) {
            return translations[currentLang][key] || translations['en'][key] || key;
        }

        const rankThemeConfig = {
            'CHALLENGER': { primary: '#f4c430', neon: '#ffd700', glow: 'rgba(255, 215, 0, 0.4)', cardBorder: '#f4c430' },
            'GRANDMASTER': { primary: '#ef4444', neon: '#ff4646', glow: 'rgba(255, 70, 70, 0.4)', cardBorder: '#ef4444' },
            'MASTER': { primary: '#a855f7', neon: '#d043ff', glow: 'rgba(208, 67, 255, 0.4)', cardBorder: '#a855f7' },
            'DIAMOND': { primary: '#38bdf8', neon: '#00d2ff', glow: 'rgba(0, 210, 255, 0.4)', cardBorder: '#38bdf8' },
            'EMERALD': { primary: '#10b981', neon: '#00ff7f', glow: 'rgba(0, 255, 127, 0.4)', cardBorder: '#10b981' },
            'PLATINUM': { primary: '#0ea5e9', neon: '#38bdf8', glow: 'rgba(14, 165, 233, 0.4)', cardBorder: '#0ea5e9' },
            'GOLD': { primary: '#eab308', neon: '#ffd700', glow: 'rgba(234, 179, 8, 0.4)', cardBorder: '#eab308' },
            'SILVER': { primary: '#94a3b8', neon: '#cbd5e1', glow: 'rgba(148, 163, 184, 0.4)', cardBorder: '#94a3b8' },
            'BRONZE': { primary: '#b45309', neon: '#d97706', glow: 'rgba(180, 83, 9, 0.4)', cardBorder: '#b45309' },
            'IRON': { primary: '#475569', neon: '#64748b', glow: 'rgba(71, 85, 105, 0.4)', cardBorder: '#475569' },
            'UNRANKED': { primary: '#334155', neon: '#475569', glow: 'rgba(51, 65, 85, 0.2)', cardBorder: '#232430' }
        };

        function getRankTheme(tier) {
            if (!tier) return rankThemeConfig['UNRANKED'];
            const clean = tier.toUpperCase().split(' ')[0].trim();
            return rankThemeConfig[clean] || rankThemeConfig['UNRANKED'];
        }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });
            document.querySelectorAll('.lang-option').forEach(btn => {
                if (btn.getAttribute('data-lang') === currentLang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            loadAccounts();
        }

        const langBtn = document.getElementById('lang-btn');
        const langDropdown = document.getElementById('lang-dropdown');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.style.display = langDropdown.style.display === 'flex' ? 'none' : 'flex';
        });

        window.addEventListener('click', () => {
            langDropdown.style.display = 'none';
        });

        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', () => {
                currentLang = opt.getAttribute('data-lang');
                applyLanguage();
                langDropdown.style.display = 'none';
            });
        });

        const btnAdd = document.querySelector('.btn-add');
        const btnSettings = document.querySelector('.btn-menu');
        const btnImport = document.getElementById('btn-import');
        const btnExport = document.getElementById('btn-export');
        
        const modal = document.getElementById('add-modal');
        const btnClose = document.getElementById('close-modal');
        const btnSave = document.getElementById('save-account');

        const settingsModal = document.getElementById('settings-modal');
        const btnCloseSettings = document.getElementById('close-settings');
        const btnOpenFolder = document.getElementById('btn-open-folder');
        const dataPathLabel = document.getElementById('data-path-label');
        const accountsCountLabel = document.getElementById('accounts-count-label');

        const confirmModal = document.getElementById('confirm-modal');
        const confirmText = document.getElementById('confirm-text');
        const confirmYes = document.getElementById('confirm-yes');
        const confirmNo = document.getElementById('confirm-no');
        let accountToDelete = null;

        const inputLoginUser = document.getElementById('login-user');
        const inputRiotId = document.getElementById('riot-id');
        const inputRegion = document.getElementById('region');
        const inputPassword = document.getElementById('password');
        const mainContent = document.querySelector('.main-content');
        const searchInput = document.getElementById('search-input');
        const filterRegion = document.getElementById('filter-region');
        const sortSelect = document.getElementById('sort-select');
        const rankStatsContainer = document.getElementById('rank-stats-container');
        const autoRefreshTimerLabel = document.getElementById('auto-refresh-timer');

        const dataPath = path.join(__dirname, 'accounts.json');

        const tierIcons = {
            'Challenger': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-challenger.png',
            'Grandmaster': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-grandmaster.png',
            'Master': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-master.png',
            'Diamond': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-diamond.png',
            'Emerald': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-emerald.png',
            'Platinum': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-platinum.png',
            'Gold': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-gold.png',
            'Silver': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-silver.png',
            'Bronze': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-bronze.png',
            'Iron': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-iron.png',
            'Unranked': 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-iron.png'
        };

        const rankWeights = { 'Challenger': 10, 'Grandmaster': 9, 'Master': 8, 'Diamond': 7, 'Emerald': 6, 'Platinum': 5, 'Gold': 4, 'Silver': 3, 'Bronze': 2, 'Iron': 1, 'Unranked': 0 };

        function showNeonNotification(message) {
            const existingToast = document.querySelector('.neon-toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'neon-toast';
            toast.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        function triggerLogin(loginUser, password) {
            exec('taskkill /f /im RiotClientServices.exe', (err) => {
                setTimeout(() => { exec('cmd /c start riotclient://'); }, 1000);
                setTimeout(() => {
                    const psScript = `
                        Add-Type -AssemblyName System.Windows.Forms
                        $wshell = New-Object -ComObject wscript.shell
                        $found = $false
                        for ($i = 0; $i -lt 20; $i++) { if ($wshell.AppActivate("Riot Client")) { $found = $true; break }; Start-Sleep -Milliseconds 500 }
                        if ($found) {
                            Start-Sleep -Seconds 1
                            [System.Windows.Forms.SendKeys]::SendWait('${loginUser}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('${password}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                        }
                    `;
                    exec(`powershell -EncodedCommand ${Buffer.from(psScript, 'utf16le').toString('base64')}`);
                }, 7000);
            });
        }

        function deleteAccount(riotId) {
            if (fs.existsSync(dataPath)) {
                let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
                accounts = accounts.filter(acc => acc.riotId !== riotId);
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
            }
        }

        function updateRankDistribution(allAccounts) {
            const tiers = Object.keys(tierIcons).filter(t => t !== 'Unranked').concat(['Unranked']);
            const counts = {};
            tiers.forEach(t => counts[t] = 0);

            allAccounts.forEach(acc => {
                const soloTier = acc.soloq && acc.soloq.tier ? acc.soloq.tier.split(' ')[0] : 'Unranked';
                if (counts[soloTier] !== undefined) counts[soloTier]++;
                else counts['Unranked']++;
            });

            rankStatsContainer.innerHTML = '';
            tiers.forEach(t => {
                const count = counts[t];
                if (count === 0 && t === 'Unranked') return;

                const iconUrl = tierIcons[t] || tierIcons['Unranked'];
                const theme = getRankTheme(t);
                const percent = allAccounts.length > 0 ? (count / allAccounts.length) * 100 : 0;
                const iconStyle = 'width: 28px; height: 28px; object-fit: contain; transform: scale(3.0); transform-origin: center;';

                const row = document.createElement('div');
                row.style.cssText = 'display: flex; align-items: center; justify-content: space-between; font-size: 11px; margin-bottom: 6px;';
                row.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px; width: 115px;">
                        <img src="${iconUrl}" alt="${t}" style="${iconStyle}">
                        <span style="color: #94a3b8; font-family: 'Cinzel', sans-serif; font-size: 10px;">${t}</span>
                    </div>
                    <div style="flex-grow: 1; margin: 0 8px; background: #161821; height: 4px; border-radius: 2px; overflow: hidden;">
                        <div style="background: ${theme.primary}; box-shadow: 0 0 8px ${theme.glow}; width: ${percent}%; height: 100%;"></div>
                    </div>
                    <span style="color: #fff; font-weight: bold; width: 15px; text-align: right;">${count}</span>
                `;
                rankStatsContainer.appendChild(row);
            });
        }

        function renderCard(account) {
            const newCard = document.createElement('div');
            newCard.className = 'account-card';
            
            const soloq = account.soloq || { tier: 'Unranked', lp: 0, minLp: 0, maxLp: 100 };
            const flex = account.flex || { tier: 'Unranked', lp: 0 };
            const region = (account.region || 'euw').toUpperCase();
            const mainTierBase = soloq.tier.split(' ')[0];
            const iconUrl = tierIcons[mainTierBase] || tierIcons['Unranked'];
            
            // Cálculo del porcentaje de LP adaptable a rangos normales (0-100) o Apex tiers
            let lpPercent = 0;
            const apexTiers = ['MASTER', 'GRANDMASTER', 'CHALLENGER'];
            if (apexTiers.includes(mainTierBase.toUpperCase())) {
                const min = soloq.minLp !== undefined ? soloq.minLp : 0;
                const max = soloq.maxLp !== undefined && soloq.maxLp > min ? soloq.maxLp : (min + 500);
                lpPercent = Math.min(Math.max(((soloq.lp - min) / (max - min)) * 100, 0), 100);
            } else {
                lpPercent = Math.min(Math.max((soloq.lp / 100) * 100, 0), 100);
            }

            const rankTheme = getRankTheme(soloq.tier);

            newCard.style.borderColor = rankTheme.cardBorder;
            newCard.style.boxShadow = `0 8px 16px -4px rgba(0, 0, 0, 0.4), 0 0 16px ${rankTheme.glow}`;

            const radarWaveHtml = `
                <div style="position: absolute; top: 30%; left: 50%; width: 220px; height: 220px; background: radial-gradient(circle, ${rankTheme.glow} 0%, transparent 70%); border-radius: 50%; pointer-events: none; animation: cardRadarWave 6s ease-in-out infinite; z-index: 0;"></div>
            `;

            newCard.innerHTML = radarWaveHtml + `
                <div style="position: relative; z-index: 1; display: flex; gap: 12px; align-items: center;">
                    <img src="${iconUrl}" alt="${soloq.tier}" style="width: 52px; height: 52px; min-width: 52px; min-height: 52px; object-fit: contain; transform: scale(3.5); transform-origin: center; filter: drop-shadow(0 0 8px ${rankTheme.glow});">
                    <div style="flex-grow: 1; overflow: hidden;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <h3 class="name" style="margin: 0; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Cinzel', sans-serif;" title="${account.riotId}">${account.riotId}</h3>
                            <span style="font-size: 10px; color: ${rankTheme.primary}; background: ${rankTheme.glow}; padding: 1px 5px; border-radius: 4px; font-weight: bold; font-family: 'Cinzel', sans-serif; border: 1px solid ${rankTheme.cardBorder};">${region}</span>
                        </div>
                        <div style="font-size: 11px; color: #6b6c75; margin-top: 2px;">${t('level')}: <strong style="color: #94a3b8;">${account.level || '30'}</strong></div>
                    </div>
                </div>

                <div class="ranks-container" style="position: relative; z-index: 1; margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
                        <span style="font-size: 12px; font-weight: bold; color: #e2e8f0; font-family: 'Cinzel', sans-serif;">Solo/Duo: <span style="color: ${rankTheme.primary};">${soloq.tier}</span></span>
                        <span style="font-size: 11px; color: ${rankTheme.primary}; font-weight: bold; font-family: 'Cinzel', sans-serif;">${soloq.lp} LP</span>
                    </div>
                    <div style="background: #1e2029; height: 5px; border-radius: 3px; overflow: hidden; margin-bottom: 8px; box-shadow: inset 0 0 4px rgba(0,0,0,0.6);">
                        <div class="lp-fill-animated" style="width: ${lpPercent}%; height: 100%; background: linear-gradient(90deg, ${rankTheme.primary}, ${rankTheme.neon}, #ffffff, ${rankTheme.neon}, ${rankTheme.primary}); box-shadow: 0 0 10px ${rankTheme.glow};"></div>
                    </div>
                    <div style="font-size: 11px; color: #6b6c75;">${t('flex')}: <strong style="color: #94a3b8;">${flex.tier} (${flex.lp} LP)</strong></div>
                </div>

                <div style="position: relative; z-index: 1; margin-top: 10px;">
                    <input type="text" class="note-input" placeholder="${t('addNote')}" value="${account.note || ''}" data-riotid="${account.riotId}">
                </div>

                <div class="card-actions" style="position: relative; z-index: 1; margin-top: 12px; display: flex; gap: 8px; border-top: 1px solid #1f2029; padding-top: 10px;">
                    <button class="btn-login" style="flex-grow: 1; padding: 7px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; font-family: 'Cinzel', sans-serif;">${t('loginBtn')}</button>
                    <button class="btn-delete" title="${t('deleteTitle')}" style="background: #161821; border: 1px solid #232430; padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;">🗑️</button>
                </div>
            `;

            newCard.querySelector('.note-input').addEventListener('input', (e) => {
                updateAccountNote(account.riotId, e.target.value);
            });

            newCard.querySelector('.btn-login').addEventListener('click', () => {
                triggerLogin(account.loginUser || account.riotId, account.password);
            });

            newCard.querySelector('.btn-delete').addEventListener('click', () => {
                accountToDelete = account.riotId;
                confirmText.textContent = `${t('deleteConfirm')} ${account.riotId}?`;
                confirmModal.style.display = 'flex';
            });

            mainContent.appendChild(newCard);
        }

        confirmYes.addEventListener('click', () => {
            if (accountToDelete) {
                deleteAccount(accountToDelete);
                accountToDelete = null;
            }
            confirmModal.style.display = 'none';
        });

        confirmNo.addEventListener('click', () => {
            accountToDelete = null;
            confirmModal.style.display = 'none';
        });

        function updateAccountNote(riotId, noteText) {
            if (fs.existsSync(dataPath)) {
                let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
                const acc = accounts.find(a => a.riotId === riotId);
                if (acc) {
                    acc.note = noteText;
                    fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                }
            }
        }

        function loadAccounts() {
            if (fs.existsSync(dataPath)) {
                try {
                    const data = fs.readFileSync(dataPath, 'utf-8');
                    let allAccounts = JSON.parse(data);
                    
                    updateRankDistribution(allAccounts);

                    const searchTerm = searchInput.value.toLowerCase();
                    const selectedRegion = filterRegion.value;
                    const sortBy = sortSelect.value;

                    let filteredAccounts = allAccounts.filter(acc => {
                        const matchesSearch = acc.riotId.toLowerCase().includes(searchTerm) || (acc.loginUser && acc.loginUser.toLowerCase().includes(searchTerm)) || (acc.note && acc.note.toLowerCase().includes(searchTerm));
                        const matchesRegion = selectedRegion === 'all' || (acc.region || 'euw').toLowerCase() === selectedRegion;
                        return matchesSearch && matchesRegion;
                    });

                    filteredAccounts.sort((a, b) => {
                        if (sortBy === 'rank') {
                            const tierA = a.soloq && a.soloq.tier ? a.soloq.tier.split(' ')[0] : 'Unranked';
                            const tierB = b.soloq && b.soloq.tier ? b.soloq.tier.split(' ')[0] : 'Unranked';
                            const weightA = rankWeights[tierA] !== undefined ? rankWeights[tierA] : 0;
                            const weightB = rankWeights[tierB] !== undefined ? rankWeights[tierB] : 0;
                            if (weightA !== weightB) return weightB - weightA;
                            const lpA = a.soloq ? a.soloq.lp : 0;
                            const lpB = b.soloq ? b.soloq.lp : 0;
                            return lpB - lpA;
                        } else {
                            return a.riotId.localeCompare(b.riotId);
                        }
                    });

                    mainContent.innerHTML = '';
                    filteredAccounts.forEach(acc => renderCard(acc)); 
                } catch (e) {
                    console.error("Error leyendo accounts.json", e);
                }
            } else {
                updateRankDistribution([]);
            }
        }

        async function refreshRanksFromDeeplol() {
            if (!fs.existsSync(dataPath)) return;
            
            let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
            if (accounts.length === 0) return;

            let updated = false;

            for (let i = 0; i < accounts.length; i++) {
                let acc = accounts[i];
                try {
                    const parts = acc.riotId.split('#');
                    if (parts.length < 2) continue;
                    
                    const nameClean = parts[0].trim().toLowerCase();
                    const tagClean = parts[1].trim().toLowerCase();
                    const targetUrl = `https://www.deeplol.gg/summoner/${(acc.region || 'euw').toLowerCase()}/${encodeURIComponent(nameClean)}-${encodeURIComponent(tagClean)}`;
                    
                    const ghostWindow = new BrowserWindow({ show: false, webPreferences: { nodeIntegration: false, contextIsolation: true } });
                    await ghostWindow.loadURL(targetUrl);

                    const scrapedData = await ghostWindow.webContents.executeJavaScript(`
                        (async () => {
                            for (let i = 0; i < 30; i++) {
                                const bodyText = document.body.innerText;
                                if (bodyText.includes("Level") || bodyText.includes("Nivel") || bodyText.includes("LP") || bodyText.includes("Unranked") || bodyText.includes("Silver") || bodyText.includes("Gold") || bodyText.includes("Platinum")) {
                                    break;
                                }
                                await new Promise(r => setTimeout(r, 500));
                            }
                            await new Promise(r => setTimeout(r, 1500));

                            // Extracción de Nivel de invocador de forma segura
                            let level = "30";
                            const levelEls = Array.from(document.querySelectorAll('*')).find(el => el.innerText && (el.innerText.toLowerCase().includes("level") || el.innerText.toLowerCase().includes("nivel")) && el.innerText.length < 20);
                            if (levelEls) {
                                const matchNum = levelEls.innerText.match(/\\d+/);
                                if (matchNum) level = matchNum[0];
                            }

                            // Función robusta para extraer rangos y LP por bloques de cola (Solo/Duo o Flex)
                            function parseQueue(queueKeyword) {
                                let tier = "Unranked";
                                let div = "";
                                let lp = 0;
                                let minLp = 0;
                                let maxLp = 100;

                                const elements = Array.from(document.querySelectorAll('div, section, span, p'));
                                const queueEl = elements.find(el => el.children.length === 0 && el.innerText && el.innerText.toLowerCase().includes(queueKeyword));

                                if (!queueEl) return { tier: "Unranked", lp: 0, minLp: 0, maxLp: 100 };

                                // Subimos al contenedor padre que agrupa la tarjeta de esa cola específica
                                let container = queueEl.parentElement;
                                for (let step = 0; step < 4; step++) {
                                    if (container && container.parentElement) container = container.parentElement;
                                }

                                const containerText = container ? container.innerText : document.body.innerText;

                                const validTiers = ["Challenger", "Grandmaster", "Master", "Diamond", "Emerald", "Platinum", "Gold", "Silver", "Bronze", "Iron"];
                                for (let vt of validTiers) {
                                    if (new RegExp('\\\\b' + vt + '\\\\b', 'i').test(containerText)) {
                                        tier = vt;
                                        break;
                                    }
                                }

                                // Buscar división (1 a 4) si aplica
                                if (tier !== "Unranked" && !["Challenger", "Grandmaster", "Master"].includes(tier)) {
                                    const divMatch = containerText.match(new RegExp(tier + '\\s*([1-4])', 'i'));
                                    if (divMatch) {
                                        div = divMatch[1];
                                    } else {
                                        const numMatch = containerText.match(/\\b([1-4])\\b/);
                                        if (numMatch) div = numMatch[1];
                                    }
                                }

                                // Buscar LP asociados a esta cola
                                const lpMatch = containerText.match(/(\\d+)\\s*LP/i);
                                if (lpMatch) {
                                    lp = parseInt(lpMatch[1]);
                                }

                                const apexTiers = ["Master", "Grandmaster", "Challenger"];
                                if (!apexTiers.includes(tier)) {
                                    lp = lp % 100;
                                    if (!div) div = "4"; // Por defecto división 4 si no se detecta
                                } else {
                                    minLp = 0;
                                    maxLp = Math.max(lp + 200, 500);
                                }

                                const finalTier = apexTiers.includes(tier) 
                                    ? tier 
                                    : (div ? \`\${tier} \${div}\` : (tier !== "Unranked" ? \`\${tier} 4\` : "Unranked"));

                                return { tier: finalTier, lp, minLp, maxLp };
                            }

                            return { 
                                level, 
                                solo: parseQueue("solo"), 
                                flex: parseQueue("flex") 
                            };
                        })()
                    `);
                    
                    try { ghostWindow.close(); } catch(err) {}
                    
                    if (scrapedData) {
                        let currentDiskAccounts = fs.existsSync(dataPath) ? JSON.parse(fs.readFileSync(dataPath, 'utf-8')) : [];
                        let targetAccount = currentDiskAccounts.find(a => a.riotId === acc.riotId);
                        if (targetAccount) {
                            targetAccount.level = scrapedData.level;
                            targetAccount.soloq = scrapedData.solo;
                            targetAccount.flex = scrapedData.flex;
                        } else {
                            acc.level = scrapedData.level;
                            acc.soloq = scrapedData.solo;
                            acc.flex = scrapedData.flex;
                            currentDiskAccounts.push(acc);
                        }
                        fs.writeFileSync(dataPath, JSON.stringify(currentDiskAccounts, null, 4));
                        updated = true;
                    }
                } catch (e) {}
            }

            if (updated) {
                loadAccounts();
                showNeonNotification(t('syncMsg'));
            }
        }

        btnAdd.addEventListener('click', () => modal.style.display = 'flex');
        btnClose.addEventListener('click', () => modal.style.display = 'none');
        btnSettings.addEventListener('click', () => {
            dataPathLabel.textContent = dataPath;
            accountsCountLabel.textContent = fs.existsSync(dataPath) ? JSON.parse(fs.readFileSync(dataPath, 'utf-8')).length : 0;
            settingsModal.style.display = 'flex';
        });
        btnCloseSettings.addEventListener('click', () => settingsModal.style.display = 'none');
        btnOpenFolder.addEventListener('click', () => shell.showItemInFolder(dataPath));

        btnExport.addEventListener('click', async () => {
            const res = await dialog.showSaveDialog({ defaultPath: 'accounts-backup.json', filters: [{ name: 'JSON', extensions: ['json'] }] });
            if (!res.canceled && res.filePath && fs.existsSync(dataPath)) fs.copyFileSync(dataPath, res.filePath);
        });

        btnImport.addEventListener('click', async () => {
            const res = await dialog.showOpenDialog({ filters: [{ name: 'JSON', extensions: ['json'] }], properties: ['openFile'] });
            if (!res.canceled && res.filePaths.length > 0) {
                try {
                    fs.writeFileSync(dataPath, fs.readFileSync(res.filePaths[0], 'utf-8'));
                    loadAccounts();
                } catch(e){}
            }
        });

        btnSave.addEventListener('click', () => {
            const loginUser = inputLoginUser.value.trim();
            const riotId = inputRiotId.value.trim();
            const region = inputRegion.value;
            const password = inputPassword.value.trim();
            if (loginUser && riotId && password) {
                let accounts = fs.existsSync(dataPath) ? JSON.parse(fs.readFileSync(dataPath, 'utf-8')) : [];
                accounts = accounts.filter(a => a.riotId !== riotId);
                accounts.push({ loginUser, riotId, region, password, soloq: {tier:"Unranked", lp:0, minLp:0, maxLp:100}, flex:{tier:"Unranked", lp:0}, level: "30", note: "" });
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
                modal.style.display = 'none';
                inputLoginUser.value = ''; inputRiotId.value = ''; inputPassword.value = '';
                refreshRanksFromDeeplol();
            }
        });

        searchInput.addEventListener('input', loadAccounts);
        filterRegion.addEventListener('change', loadAccounts);
        sortSelect.addEventListener('change', loadAccounts);
        
        applyLanguage();

        const REFRESH_INTERVAL_SECONDS = 15;
        let secondsRemaining = REFRESH_INTERVAL_SECONDS;
        let isRefreshing = false;

        setInterval(async () => {
            if (isRefreshing) return;

            secondsRemaining--;

            if (secondsRemaining <= 0) {
                isRefreshing = true;
                autoRefreshTimerLabel.textContent = `Updating...`;
                
                try {
                    await refreshRanksFromDeeplol();
                } catch (err) {
                    console.error("Error en auto-refresh:", err);
                } finally {
                    isRefreshing = false;
                    secondsRemaining = REFRESH_INTERVAL_SECONDS;
                }
            }
            
            if (!isRefreshing) {
                if (secondsRemaining >= 60) {
                    const minutesLeft = Math.ceil(secondsRemaining / 60);
                    autoRefreshTimerLabel.textContent = `Next refresh ${minutesLeft} min`;
                } else {
                    autoRefreshTimerLabel.textContent = `Next refresh ${secondsRemaining}s`;
                }
            }
        }, 1000);
    </script>
</body>
