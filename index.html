<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Accounts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo-area">
            <h2 class="title">LEAGUE ACCOUNTS</h2>
        </div>
        <button class="btn-add">+ Add account</button>
        <button class="btn-refresh" id="btn-refresh-all" style="margin-top: 10px; width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; cursor: pointer;">🔄 Refresh Ranks</button>
        <div class="spacer"></div>
        <button class="btn-menu">Settings</button>
    </div>
    
    <div class="main-content">
        <!-- Las tarjetas se cargarán aquí -->
    </div>

    <!-- Ventana modal -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h3>ADD ACCOUNT</h3>
            <input type="text" id="login-user" placeholder="Usuario de Login (Riot)">
            <input type="text" id="riot-id" placeholder="Riot ID (ej. Nombre#TAG)">
            <div class="input-group" style="margin-bottom: 15px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px;">Región</label>
                <select id="region" style="width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px;">
                    <option value="euw">EUW</option>
                    <option value="eune">EUNE</option>
                    <option value="na">NA</option>
                    <option value="kr">KR</option>
                </select>
            </div>
            <input type="password" id="password" placeholder="Contraseña">
            <button id="save-account" class="btn-add">Save</button>
            <button id="close-modal" class="btn-login" style="margin-top: 10px; width: 100%;">Cancel</button>
        </div>
    </div>

    <script>
        const fs = require('fs');
        const path = require('path');
        const { exec } = require('child_process');
        const { BrowserWindow } = require('@electron/remote');

        const btnAdd = document.querySelector('.btn-add');
        const btnRefreshAll = document.getElementById('btn-refresh-all');
        const modal = document.getElementById('add-modal');
        const btnClose = document.getElementById('close-modal');
        const btnSave = document.getElementById('save-account');
        const inputLoginUser = document.getElementById('login-user');
        const inputRiotId = document.getElementById('riot-id');
        const inputRegion = document.getElementById('region');
        const inputPassword = document.getElementById('password');
        const mainContent = document.querySelector('.main-content');

        const dataPath = path.join(__dirname, 'accounts.json');

        function triggerLogin(loginUser, password) {
            exec('taskkill /f /im RiotClientServices.exe', (err) => {
                setTimeout(() => {
                    exec('cmd /c start riotclient://');
                }, 1000);

                setTimeout(() => {
                    const psScript = `
                        Add-Type -AssemblyName System.Windows.Forms
                        $wshell = New-Object -ComObject wscript.shell
                        
                        $found = $false
                        for ($i = 0; $i -lt 20; $i++) {
                            if ($wshell.AppActivate("Riot Client")) {
                                $found = $true
                                break
                            }
                            Start-Sleep -Milliseconds 500
                        }
                        
                        if ($found) {
                            Start-Sleep -Seconds 1
                            [System.Windows.Forms.SendKeys]::SendWait('${loginUser}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('${password}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                        }
                    `;
                    const encodedCommand = Buffer.from(psScript, 'utf16le').toString('base64');
                    exec(`powershell -EncodedCommand ${encodedCommand}`);
                }, 7000);
            });
        }

        function deleteAccount(riotId) {
            if (fs.existsSync(dataPath)) {
                const data = fs.readFileSync(dataPath, 'utf-8');
                let accounts = JSON.parse(data);
                accounts = accounts.filter(acc => acc.riotId !== riotId);
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
            }
        }

        function renderCard(account) {
            const newCard = document.createElement('div');
            newCard.className = 'account-card';
            
            const soloq = account.soloq || { tier: 'Unranked', lp: 0 };
            const flex = account.flex || { tier: 'Unranked', lp: 0 };
            const region = (account.region || 'euw').toUpperCase();

            newCard.innerHTML = `
                <div class="account-info">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 class="name" style="margin: 0;">${account.riotId}</h3>
                        <span class="region-tag" style="font-size: 11px; color: #38bdf8; background: rgba(56,189,248,0.1); padding: 2px 6px; border-radius: 4px;">[${region}]</span>
                    </div>
                    <div class="ranks-container" style="display: flex; gap: 20px; margin-top: 10px; font-size: 13px; color: #94a3b8;">
                        <div class="rank-solo">
                            <span>Solo/Duo:</span> <strong style="color: #fff;">${soloq.tier}</strong> <span class="lp" style="color: #38bdf8;">(${soloq.lp} LP)</span>
                        </div>
                        <div class="rank-flex">
                            <span>Flex:</span> <strong style="color: #fff;">${flex.tier}</strong> <span class="lp" style="color: #38bdf8;">(${flex.lp} LP)</span>
                        </div>
                    </div>
                </div>
                <div class="card-actions" style="margin-top: 12px; display: flex; gap: 8px;">
                    <button class="btn-login">➔ Log in</button>
                    <button class="btn-delete" title="Eliminar cuenta">🗑️</button>
                </div>
            `;

            newCard.querySelector('.btn-login').addEventListener('click', () => {
                triggerLogin(account.loginUser || account.riotId, account.password);
            });

            newCard.querySelector('.btn-delete').addEventListener('click', () => {
                if (confirm(`¿Seguro que quieres eliminar la cuenta ${account.riotId}?`)) {
                    deleteAccount(account.riotId);
                }
            });

            mainContent.appendChild(newCard);
        }

        function loadAccounts() {
            if (fs.existsSync(dataPath)) {
                try {
                    const data = fs.readFileSync(dataPath, 'utf-8');
                    const accounts = JSON.parse(data);
                    mainContent.innerHTML = '';
                    accounts.forEach(acc => {
                        renderCard(acc);
                    }); 
                } catch (e) {
                    console.error("Error leyendo accounts.json", e);
                }
            }
        }

        // Extracción automática de rangos usando DeepLol mediante ventana fantasma
        async function refreshRanksFromDeeplol() {
            if (!fs.existsSync(dataPath)) {
                alert("No se encontró el archivo accounts.json");
                return;
            }
            
            let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
            let updated = false;

            if (accounts.length === 0) {
                alert("No hay cuentas guardadas.");
                return;
            }

            for (let acc of accounts) {
                try {
                    const parts = acc.riotId.split('#');
                    if (parts.length < 2) continue;
                    const namePart = encodeURIComponent(parts[0].trim().toLowerCase());
                    const tagPart = encodeURIComponent(parts[1].trim().toLowerCase());
                    const regCode = (acc.region || 'euw').toLowerCase();

                    const targetUrl = `https://www.deeplol.gg/summoner/${regCode}/${namePart}-${tagPart}`;

                    const ghostWindow = new BrowserWindow({
                        show: false,
                        webPreferences: { nodeIntegration: false, contextIsolation: true }
                    });

                    await ghostWindow.loadURL(targetUrl);

                    // Extracción con soporte para nodos de texto separados para los LP
                    const rankedData = await ghostWindow.webContents.executeJavaScript(`
                        (async () => {
                            for (let i = 0; i < 20; i++) {
                                const allText = document.body.innerText;
                                if (allText.includes("LP") || allText.includes("Solo") || allText.includes("Unranked")) {
                                    break;
                                }
                                await new Promise(r => setTimeout(r, 500));
                            }

                            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                            let node;
                            let textNodes = [];
                            while(node = walker.nextNode()) {
                                if(node.nodeValue.trim().length > 0) {
                                    textNodes.push(node.nodeValue.trim());
                                }
                            }

                            function getQueueInfo(queueName) {
                                const qIndex = textNodes.findIndex(t => t.toLowerCase() === queueName.toLowerCase());
                                if (qIndex === -1) return { tier: "Unranked", lp: 0 };

                                let tier = "Unranked";
                                let div = "";
                                let lp = 0;
                                const validTiers = ["Challenger", "Grandmaster", "Master", "Diamond", "Emerald", "Platinum", "Gold", "Silver", "Bronze", "Iron"];

                                for (let i = qIndex; i < Math.min(qIndex + 18, textNodes.length); i++) {
                                    const txt = textNodes[i];
                                    
                                    if (txt.toLowerCase() === "unranked") {
                                        return { tier: "Unranked", lp: 0 };
                                    }

                                    // Buscar Tier y División
                                    for (let t of validTiers) {
                                        if (txt.toLowerCase() === t.toLowerCase() || txt.toLowerCase().startsWith(t.toLowerCase() + " ")) {
                                            tier = t;
                                            const parts = txt.split(/\\s+/);
                                            if (parts[1] && /^[1-4]$/.test(parts[1])) {
                                                div = parts[1];
                                            }
                                        }
                                    }

                                    if (tier !== "Unranked" && !div && /^[1-4]$/.test(txt)) {
                                        div = txt;
                                    }

                                    // Búsqueda inteligente de LP (maneja si el número y "LP" están juntos o separados en nodos)
                                    if (txt.toUpperCase().includes("LP") || txt.toUpperCase() === "LP") {
                                        // Revisar si el número está en el mismo texto
                                        const match = txt.match(/(\\d+)/);
                                        if (match) {
                                            lp = parseInt(match[1]);
                                        } 
                                        // O si el número está en el nodo de texto inmediatamente anterior
                                        else if (i > 0 && /^\\d+$/.test(textNodes[i - 1])) {
                                            lp = parseInt(textNodes[i - 1]);
                                        }
                                    }
                                    // Por si acaso el nodo actual es solo el número de LP y el siguiente es "LP"
                                    else if (/^\\d+$/.test(txt) && i + 1 < textNodes.length && textNodes[i + 1].toUpperCase().includes("LP")) {
                                        // Asegurarnos de que no sea la división (las divisiones son 1-4, los LP suelen ser más o 0)
                                        // Si ya tenemos división y este número está más abajo cerca de LP, lo cogemos
                                        if (parseInt(txt) > 4 || txt === "0") {
                                            lp = parseInt(txt);
                                        }
                                    }
                                }

                                if (tier === "Unranked") return { tier: "Unranked", lp: 0 };
                                if (["Master", "Grandmaster", "Challenger"].includes(tier)) {
                                    return { tier: tier, lp: lp };
                                }

                                return {
                                    tier: div ? \`\${tier} \${div}\` : tier,
                                    lp: lp
                                };
                            }

                            return {
                                solo: getQueueInfo("Solo"),
                                flex: getQueueInfo("Flex")
                            };
                        })()
                    `);

                    ghostWindow.close();

                    if (rankedData) {
                        acc.soloq = rankedData.solo;
                        acc.flex = rankedData.flex;
                        updated = true;
                    }

                } catch (e) {
                    console.error("Error al actualizar:", e);
                }
            }

            if (updated) {
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
                alert("¡Rangos, divisiones y LP sincronizados al 100%!");
            } else {
                alert("No se pudieron extraer los datos. Comprueba que el Riot ID y la región sean exactos.");
            }
        }

        function saveAccountToFile(loginUser, riotId, region, password) {
            let accounts = [];
            if (fs.existsSync(dataPath)) {
                try {
                    const data = fs.readFileSync(dataPath, 'utf-8');
                    accounts = JSON.parse(data);
                } catch (e) {}
            }
            accounts = accounts.filter(acc => acc.riotId !== riotId);
            accounts.push({ 
                loginUser, 
                riotId, 
                region, 
                password,
                soloq: { tier: "Unranked", lp: 0 },
                flex: { tier: "Unranked", lp: 0 }
            }); 
            fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
        }

        btnAdd.addEventListener('click', () => modal.style.display = 'flex');
        btnClose.addEventListener('click', () => modal.style.display = 'none');

        btnRefreshAll.addEventListener('click', () => {
            refreshRanksFromDeeplol();
        });

        btnSave.addEventListener('click', () => {
            const loginUser = inputLoginUser.value.trim();
            const riotId = inputRiotId.value.trim();
            const region = inputRegion.value;
            const password = inputPassword.value.trim();

            if (loginUser !== "" && riotId !== "" && password !== "") {
                saveAccountToFile(loginUser, riotId, region, password);
                loadAccounts();

                modal.style.display = 'none';
                inputLoginUser.value = '';
                inputRiotId.value = '';
                inputPassword.value = '';
            } else {
                alert("Por favor, rellena todos los campos.");
            }
        });

        loadAccounts();
    </script>
</body>
</html>
