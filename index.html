<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Accounts</title>
    <!-- Importamos la tipografía Cinzel estilo LoL desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/themes.js"></script>
</head>
<body>
    <div id="christmas-snow" class="christmas-snow" aria-hidden="true" hidden></div>
    <audio id="christmas-audio" loop preload="none" aria-hidden="true"></audio>
    <header class="titlebar" id="titlebar">
        <div class="titlebar-brand"></div>
        <div class="titlebar-controls">
            <button class="tb-btn" id="tb-min" data-i18n-aria-label="winMinimize" data-i18n-title="winMinimize">
                <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="tb-btn" id="tb-max">
                <svg class="icon-maximize" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5V0.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="tb-btn close" id="tb-close" data-i18n-aria-label="winClose" data-i18n-title="winClose">
                <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
            </button>
        </div>
    </header>

    <div class="app-shell">
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="logo.svg" alt="">
            <span class="sidebar-brand-name">Aurum Accounts</span>
        </div>

        <button class="btn-add sb-add">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="addAccountBtn"></span>
            <kbd>Ctrl N</kbd>
        </button>

        <div class="sb-panel">
            <div class="sb-label" data-i18n="rankDistribution"></div>
            <div id="rank-stats-container"></div>
        </div>

        <div id="auto-refresh-box" class="sb-refresh" data-i18n-title="refreshNowTip">
            <div class="sb-refresh-ring">
                <svg class="sb-refresh-progress" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" stroke="rgba(201, 168, 92, 0.18)" stroke-width="2" fill="none"/>
                    <circle id="auto-refresh-progress-circle" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="56.55" stroke-dashoffset="0" stroke-linecap="round"/>
                </svg>
                <svg class="sb-refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            </div>
            <div class="sb-refresh-text">
                <span class="sb-refresh-label" data-i18n="autoRefreshLabel"></span>
                <span id="auto-refresh-timer"></span>
            </div>
        </div>

        <nav class="sidebar-view-nav" data-i18n-aria-label="navViewSelector">
            <button type="button" class="sidebar-view-tab active" data-main-view="accounts" aria-pressed="true" data-i18n="navMyAccounts"></button>
            <button type="button" class="sidebar-view-tab" data-main-view="friends" aria-pressed="false" data-i18n="navFriendsRivals"></button>
        </nav>

        <div class="spacer" style="flex-grow: 1;"></div>

        <nav class="sb-nav">
            <button class="sb-nav-item" id="btn-import"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="navImport"></span></button>
            <button class="sb-nav-item" id="btn-export"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg><span data-i18n="navExport"></span></button>
            <button class="sb-nav-item" id="btn-data-folder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span data-i18n="navDataFolder"></span></button>
            <button class="sb-nav-item aurum-match-nav" id="btn-aurum-match">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2"/><path d="M16 4.5a4 4 0 0 1 0 7.5"/><path d="M18 14a6 6 0 0 1 4 5.7V21"/></svg>
                <span data-i18n="duoNav"></span>
            </button>
            <button class="sb-nav-item btn-menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="navSettings"></span></button>
        </nav>
        <div class="sb-version" id="sb-version"></div>
    </div>
    
    <div class="content-wrapper" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="app-header topbar">
            <div class="tb-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" spellcheck="false">
                <kbd>Ctrl F</kbd>
            </div>

            <div class="tb-controls">
                <label class="tb-pill accounts-only-control">
                    <span class="tb-pill-label" data-i18n="selRegionLabel"></span>
                    <select id="filter-region"></select>
                    <svg class="tb-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </label>

                <label class="tb-pill accounts-only-control">
                    <span class="tb-pill-label" data-i18n="selSortLabel"></span>
                    <select id="sort-select">
                        <option value="rank" data-i18n="selRank"></option>
                        <option value="name" data-i18n="selName"></option>
                        <option value="manual" data-i18n="selManual"></option>
                    </select>
                    <svg class="tb-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </label>

                <label class="tb-pill accounts-only-control">
                    <span class="tb-pill-label" data-i18n="selCategoryLabel"></span>
                    <select id="filter-category">
                        <option value="all" data-i18n="allCategories"></option>
                    </select>
                    <svg class="tb-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </label>

                <button id="toggle-view" class="tb-icon-btn tb-view-toggle accounts-only-control" type="button" aria-pressed="false" data-i18n-title="viewToList" data-i18n-aria-label="viewToList">
                    <svg class="view-grid-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <svg class="view-list-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
                </button>

                <button id="update-pill" class="tb-update-pill" type="button" data-i18n-title="updModalTitle">
                    <div class="tb-update-pill-icon">
                        <svg class="tb-update-pill-ring" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle class="tb-update-pill-ring-bg" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-opacity="0.15"/>
                            <circle class="tb-update-pill-ring-progress" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="56.55" transform="rotate(-90 12 12)"/>
                        </svg>
                        <svg class="tb-update-pill-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8.5 12.5 3.5-3.5 3.5 3.5"/><path d="M12 9v7"/></svg>
                    </div>
                    <span id="update-pill-version"></span>
                </button>

                <button id="hextech-chest-button" class="tb-hextech-chest" type="button" data-i18n-title="chestButtonTitle" aria-label="Hextech chests">
                    <svg class="hextech-chest-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 9.5h16v10H4z"/><path d="M3 9.5 5.5 4h13L21 9.5M3 9.5h18M10 9.5v10M14 9.5v10"/><path d="M12 4v5.5"/>
                    </svg>
                    <span id="hextech-chest-count" class="hextech-chest-count">0</span>
                </button>
                <button id="soundboard-toggle" class="tb-icon-btn tb-soundboard-btn" type="button" aria-pressed="false">
                    <svg class="soundboard-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                    <svg class="soundboard-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 5 6"/><path d="m22 9-5 6"/></svg>
                </button>

                <button id="streamer-btn" class="tb-icon-btn tb-streamer-btn" type="button" aria-pressed="false" data-i18n-title="streamerTip">
                    <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.4 0 10 8 10 8a17 17 0 0 1-3.2 4.2"/><path d="M6.6 6.6A16.6 16.6 0 0 0 2 12s3.6 8 10 8a10.4 10.4 0 0 0 5.4-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>
                </button>
                <div style="position: relative;">
                    <button id="lang-btn" class="tb-icon-btn" data-i18n-title="langTip">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                    </button>
                    <div id="lang-dropdown" class="lang-dropdown">
                        <button class="lang-option" data-lang="es">Español</button>
                        <button class="lang-option" data-lang="en">English</button>
                        <button class="lang-option" data-lang="fr">Français</button>
                        <button class="lang-option" data-lang="de">Deutsch</button>
                        <button class="lang-option" data-lang="pt">Português</button>
                        <button class="lang-option" data-lang="ru">Русский</button>
                        <button class="lang-option" data-lang="tr">Türkçe</button>
                        <button class="lang-option" data-lang="zh">中文</button>
                        <button class="lang-option" data-lang="ja">日本語</button>
                        <button class="lang-option" data-lang="ko">한국어</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="client-sync-banner" class="client-sync-banner" data-state="offline" role="status" aria-live="polite">
            <span class="client-sync-indicator" aria-hidden="true"></span>
            <span id="client-sync-message" data-i18n="clientSyncWaiting"></span>
            <button type="button" id="client-sync-import" class="client-sync-import" data-i18n="clientSyncImport" hidden></button>
        </div>

        <div class="main-content" style="overflow-y: auto; padding: 30px; flex-grow: 1; min-width: 0; background: #07080a;">
        </div>
    </div>
    </div><!-- /.app-shell -->

    <!-- Modales -->
    <!-- Panel lateral: añadir / editar cuenta -->
    <!-- Línea de neón bajo la barra de título mientras el modo streamer está activo -->
    <div id="streamer-line" class="streamer-line" aria-hidden="true"></div>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="account-drawer" class="account-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
        <div class="drawer-head">
            <h3 id="drawer-title" data-i18n="drawerAddTitle"></h3>
            <p class="drawer-sub" data-i18n="drawerSub"></p>
            <button class="settings-x" id="drawer-close" data-i18n-aria-label="closeBtn">✕</button>
        </div>

        <div class="drawer-body">
            <div class="drawer-tabs" id="drawer-tabs">
                <button type="button" class="drawer-tab active" data-tab="single" data-i18n="tabSingle"></button>
                <button type="button" class="drawer-tab" data-tab="bulk" data-i18n="tabBulk"></button>
            </div>

            <!-- Una cuenta -->
            <div id="tab-single">
                <div class="field">
                    <label for="acc-login-user" data-i18n="fieldLoginUser"></label>
                    <input type="text" id="acc-login-user" data-i18n-placeholder="loginUserPh" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                    <label for="acc-riot-id"><span data-i18n="fieldRiotId"></span> <em data-i18n="optional"></em></label>
                    <input type="text" id="acc-riot-id" data-i18n-placeholder="riotIdPh" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                    <label for="acc-region" data-i18n="regionLabel"></label>
                    <select id="acc-region"></select>
                </div>
                <div class="field">
                    <label for="acc-password" data-i18n="fieldPassword"></label>
                    <div class="password-wrap">
                        <input type="password" id="acc-password" autocomplete="new-password">
                        <button type="button" class="eye-btn" id="toggle-password" data-i18n-aria-label="showPassword">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label for="acc-description"><span data-i18n="fieldDescription"></span> <em data-i18n="optional"></em></label>
                    <input type="text" id="acc-description" data-i18n-placeholder="descriptionPh" maxlength="80">
                </div>
                <div class="field">
                    <label for="acc-tags"><span data-i18n="fieldTags"></span> <em data-i18n="optional"></em></label>
                    <input type="text" id="acc-tags" data-i18n-placeholder="tagsPh" maxlength="200">
                </div>
                <div class="field">
                    <label for="acc-group"><span data-i18n="fieldGroup"></span> <em data-i18n="optional"></em></label>
                    <input type="text" id="acc-group" data-i18n-placeholder="groupPh" maxlength="60">
                </div>
                <div class="field-error" id="single-error"></div>
                <button type="button" class="btn-gold" id="drawer-submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    <span id="drawer-submit-label" data-i18n="addAccountBtn"></span>
                </button>
            </div>

            <!-- Carga masiva -->
            <div id="tab-bulk" style="display: none;">
                <div class="field">
                    <label for="bulk-text" data-i18n="bulkLabel"></label>
                    <textarea id="bulk-text" spellcheck="false" data-i18n-placeholder="bulkPh"></textarea>
                    <div class="field-hint" data-i18n="bulkHint"></div>
                </div>
                <div class="field">
                    <label for="bulk-region" data-i18n="bulkDefaultRegion"></label>
                    <select id="bulk-region"></select>
                </div>
                <div class="field-error" id="bulk-error"></div>
                <button type="button" class="btn-gold" id="bulk-submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    <span data-i18n="bulkSubmit"></span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Pantalla de inicio de sesión -->
    <div id="login-overlay" class="login-overlay" aria-hidden="true">
        <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-live="polite">
            <div class="login-emblem">
                <svg class="login-rings" viewBox="0 0 200 200" aria-hidden="true">
                    <circle class="ring-track" cx="100" cy="100" r="94"/>
                    <circle class="ring-track" cx="100" cy="100" r="82"/>
                    <g class="ring-spin"><circle class="ring-arc green" cx="100" cy="100" r="94" stroke-dasharray="150 441"/></g>
                    <g class="ring-spin reverse"><circle class="ring-arc gold" cx="100" cy="100" r="82" stroke-dasharray="190 325"/></g>
                    <circle class="ring-full" cx="100" cy="100" r="94"/>
                    <circle class="ring-full" cx="100" cy="100" r="82"/>
                </svg>
                <div class="login-core"><img id="login-emblem-img" alt=""></div>
            </div>
            <h2 class="login-title" id="login-title"></h2>
            <div class="login-account sens sens-id" id="login-account"></div>
            <div class="login-bar"><div class="login-bar-fill" id="login-bar-fill"></div></div>
            <ul class="login-steps" id="login-steps"></ul>
            <div class="login-footer-text" id="login-footer-text"></div>
            <div class="login-actions">
                <button type="button" class="settings-cancel" id="login-btn-retry"></button>
                <button type="button" class="settings-cancel" id="login-btn-cancel"></button>
                <button type="button" class="settings-save" id="login-btn-close"></button>
            </div>
        </div>
    </div>

    <!-- Menú contextual de las tarjetas -->
    <div id="card-menu" class="ctx-menu" role="menu">
        <button class="ctx-item" data-action="opgg" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
            <span data-i18n="ctxOpgg"></span>
        </button>
        <button class="ctx-item" data-action="edit" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
            <span data-i18n="ctxEdit"></span>
        </button>
        <div class="ctx-sep"></div>
        <button class="ctx-item danger" data-action="delete" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span data-i18n="ctxDelete"></span>
            <span class="ctx-kbd">Del</span>
        </button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-head">

                <h3 id="aurum-match-title" data-i18n="duoTitle"></h3>
                <button type="button" class="settings-x" id="aurum-match-close" data-i18n-aria-label="closeBtn">✕</button>
            </div>
            <p class="aurum-match-intro" data-i18n="duoDescription"></p>
            <div class="duo-board-toolbar">
                <label class="duo-filter">
                    <span data-i18n="duoQueueFilter"></span>
                    <select id="duo-queue-filter">
                        <option value="all" data-i18n="duoFilterAll"></option>
                        <option value="soloDuo" data-i18n="duoQueueSolo"></option>
                        <option value="flex" data-i18n="duoQueueFlex"></option>
                    </select>
                </label>
                <label class="duo-filter">
                    <span data-i18n="duoRoleFilter"></span>
                    <select id="duo-role-filter">
                        <option value="all" data-i18n="duoFilterAll"></option>
                        <option value="top" data-i18n="duoRoleTop"></option>
                        <option value="jungle" data-i18n="duoRoleJungle"></option>
                        <option value="mid" data-i18n="duoRoleMid"></option>
                        <option value="adc" data-i18n="duoRoleAdc"></option>
                        <option value="support" data-i18n="duoRoleSupport"></option>
                    </select>
                </label>
                <button type="button" class="settings-save duo-publish-open" id="duo-publish-open" data-i18n="duoPublishOpen"></button>
            </div>
            <div class="duo-feed-heading">
                <div>
                    <h4 data-i18n="duoFeedTitle"></h4>
                    <p data-i18n="duoFeedDescription"></p>
                </div>
                <button type="button" class="settings-cancel duo-refresh" id="duo-refresh" data-i18n="duoRefresh"></button>
            </div>
            <p id="duo-board-status" class="duo-status" aria-live="polite"></p>
            <div id="duo-feed" class="duo-feed" role="list"></div>
            <div id="duo-feed-empty" class="duo-feed-empty" hidden>
                <span class="duo-feed-empty-icon" aria-hidden="true">✦</span>
                <strong data-i18n="duoFeedEmptyTitle"></strong>
                <p data-i18n="duoFeedEmptyText"></p>
                <button type="button" class="settings-save" id="duo-publish-empty" data-i18n="duoPublishOpen"></button>
            </div>
        </div>
    </div>

    <div id="duo-publish-modal" class="modal duo-publish-modal" aria-hidden="true">
        <div class="modal-content duo-publish-dialog" role="dialog" aria-modal="true" aria-labelledby="duo-publish-title">
            <div class="achievements-header">
                <h3 id="duo-publish-title" data-i18n="duoPublishTitle"></h3>
                <button type="button" class="settings-x" id="duo-publish-close" data-i18n-aria-label="closeBtn">✕</button>
            </div>
            <p class="duo-publish-intro" data-i18n="duoPublishDescription"></p>
            <form id="duo-publish-form" class="duo-publish-form" autocomplete="off">
                <label class="duo-field">
                    <span data-i18n="duoAccount"></span>
                    <select id="duo-account"></select>
                </label>
                <div class="duo-role-grid">
                    <label class="duo-field">
                        <span data-i18n="duoPrimaryRole"></span>
                        <select id="duo-primary-role"></select>
                    </label>
                    <label class="duo-field">
                        <span data-i18n="duoSecondaryRole"></span>
                        <select id="duo-secondary-role"></select>
                    </label>
                </div>
                <label class="duo-field">
                    <span data-i18n="duoQueue"></span>
                    <select id="duo-queue">
                        <option value="soloDuo" data-i18n="duoQueueSolo"></option>
                        <option value="flex" data-i18n="duoQueueFlex"></option>
                    </select>
                </label>
                <label class="duo-field">
                    <span data-i18n="duoPlayStyle"></span>
                    <input id="duo-play-style" type="text" maxlength="100" data-i18n-placeholder="duoStylePlaceholder">
                </label>
                <div class="duo-role-grid">
                    <label class="duo-field">
                        <span data-i18n="duoVoice"></span>
                        <select id="duo-voice">
                            <option value="any" data-i18n="duoVoiceAny"></option>
                            <option value="yes" data-i18n="duoVoiceYes"></option>
                            <option value="no" data-i18n="duoVoiceNo"></option>
                        </select>
                    </label>
                    <label class="duo-field">
                        <span data-i18n="duoGoal"></span>
                        <input id="duo-goal" type="text" maxlength="80" data-i18n-placeholder="duoGoalPlaceholder">
                    </label>
                </div>
                <label class="duo-public-consent">
                    <input id="duo-public-consent" type="checkbox" required>
                    <span data-i18n="duoPublicConsent"></span>
                </label>
                <p id="duo-publish-status" class="duo-status" aria-live="polite"></p>
                <div class="duo-publish-actions">
                    <button type="button" class="settings-cancel" id="duo-publish-cancel" data-i18n="cancelBtn"></button>
                    <button type="submit" class="settings-save" id="duo-publish-submit" data-i18n="duoPublishSubmit"></button>
                </div>
            </form>
        </div>
    </div>

    <button type="button" id="poro-game-fab" class="poro-game-fab" data-i18n-title="poroOpen" aria-label="Poro Dodge" hidden>🐾</button>
    <div id="poro-game-modal" class="modal poro-game-modal" aria-hidden="true">
        <div class="modal-content poro-game-dialog" role="dialog" aria-modal="true" aria-labelledby="poro-game-title">
            <div class="achievements-header">
                <h3 id="poro-game-title" data-i18n="poroTitle"></h3>
                <button type="button" class="settings-x" id="poro-game-close" data-i18n-aria-label="closeBtn">✕</button>
            </div>
            <p class="poro-game-description" data-i18n="poroDescription"></p>
            <div class="poro-game-scoreboard">
                <span><span data-i18n="poroScore"></span>: <strong id="poro-game-score">0</strong></span>
                <span><span data-i18n="poroHighScore"></span>: <strong id="poro-game-high-score">0</strong></span>
            </div>
            <canvas id="poro-game-canvas" class="poro-game-canvas" width="800" height="460" data-i18n-aria-label="poroCanvasLabel"></canvas>
            <div id="poro-game-status" class="poro-game-status" data-i18n="poroInstructions"></div>
            <div class="poro-game-actions">
                <button type="button" class="settings-save" id="poro-game-start" data-i18n="poroStart"></button>
            </div>
        </div>
    </div>

    <!-- Aviso de actualización: se queda en el centro hasta que el usuario decide -->
    <div id="update-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="update-modal-title">
        <div class="modal-content update-card">
            <div class="update-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 3.5-3.5 3.5 3.5"/><path d="M12 9v7"/></svg>
            </div>
            <h3 id="update-modal-title"></h3>
            <p id="update-modal-text"></p>
            <div id="update-progress" class="update-progress"><span id="update-progress-bar"></span></div>
            <div class="update-actions">
                <button type="button" id="update-later" class="settings-cancel"></button>
                <button type="button" id="update-action" class="btn-gold"></button>
            </div>
        </div>
    </div>

    <aside id="ranked-focus-widget" class="ranked-focus-widget" aria-live="polite" aria-hidden="true" hidden>
        <div class="ranked-focus-widget-heading">
            <span class="ranked-focus-indicator" aria-hidden="true"></span>
            <span data-i18n="focusWidgetTitle"></span>
            <span id="ranked-focus-queue"></span>
        </div>
        <strong id="ranked-focus-timer">00:00</strong>
        <span class="ranked-focus-account-label" data-i18n="focusWidgetAccount"></span>
        <span id="ranked-focus-account"></span>
        <button id="ranked-focus-exit" type="button" data-i18n="focusExit"></button>
    </aside>

    <script src="js/translations.js"></script>
    <script src="js/focusMode.js"></script>
    <script src="js/soundboard.js"></script>
    <script src="js/mastery.js"></script>
    <script src="js/hextechChest.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/gamerCard.js"></script>
    <script src="js/minigame.js"></script>
    <script src="js/duoFinder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
