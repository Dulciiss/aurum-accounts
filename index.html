<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Accounts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            align-content: start;
        }
        .account-card {
            background: linear-gradient(145deg, #14151c, #101117);
            border: 1px solid #232430;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.4), 0 0 10px rgba(59, 130, 246, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .account-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -4px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.15);
        }
        .sidebar-btn {
            width: 100%;
            padding: 9px 12px;
            background: #111218;
            border: 1px solid #232430;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .sidebar-btn:hover {
            background: #1e2029;
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
        }
        .note-input {
            background: #0b0c10;
            border: 1px solid #232430;
            color: #cbd5e1;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .note-input:focus {
            border-color: #3b82f6;
        }

        @keyframes neonPulse {
            0% {
                filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.4)) drop-shadow(0 0 6px rgba(59, 130, 246, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.8)) drop-shadow(0 0 14px rgba(59, 130, 246, 0.4));
            }
            100% {
                filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.4)) drop-shadow(0 0 6px rgba(59, 130, 246, 0.2));
            }
        }
        .neon-icon {
            animation: neonPulse 3s infinite ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rotating-spinner {
            animation: spin 3s linear infinite;
        }

        /* Notificación Neón Bonita */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .neon-toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #111218, #171923);
            border: 1px solid #3b82f6;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), inset 0 0 10px rgba(59, 130, 246, 0.1);
            font-size: 13px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .neon-toast.hiding {
            animation: fadeOut 0.4s ease forwards;
        }

        .lang-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: #14151c;
            border: 1px solid #232430;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            width: 130px;
            z-index: 1000;
            overflow: hidden;
        }
        .lang-option {
            padding: 8px 12px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            transition: 0.2s;
        }
        .lang-option:hover {
            background: #1e2029;
            color: #fff;
        }
        .lang-option.active {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>

        function getSystemLanguage() {
            const sysLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
            return translations[sysLang] ? sysLang : 'en';
        }

        let currentLang = getSystemLanguage();

        function t(key) {
            return translations[currentLang][key] || translations['en'][key] || key;
        }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });
            document.querySelectorAll('.lang-option').forEach(btn => {

        function showNeonNotification(message) {
            const existingToast = document.querySelector('.neon-toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'neon-toast';
            toast.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        function triggerLogin(loginUser, password) {
            exec('taskkill /f /im RiotClientServices.exe', (err) => {
                setTimeout(() => { exec('cmd /c start riotclient://'); }, 1000);
                setTimeout(() => {
                    const psScript = `
                        Add-Type -AssemblyName System.Windows.Forms
                        $wshell = New-Object -ComObject wscript.shell
                        $found = $false
                        for ($i = 0; $i -lt 20; $i++) { if ($wshell.AppActivate("Riot Client")) { $found = $true; break }; Start-Sleep -Milliseconds 500 }
                        if ($found) {
                            Start-Sleep -Seconds 1
                            [System.Windows.Forms.SendKeys]::SendWait('${loginUser}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('${password}')
                            Start-Sleep -Milliseconds 600
                            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
                        }
                    `;
                    exec(`powershell -EncodedCommand ${Buffer.from(psScript, 'utf16le').toString('base64')}`);
                }, 7000);
            });
        }

        function deleteAccount(riotId) {
            if (fs.existsSync(dataPath)) {
                let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
                accounts = accounts.filter(acc => acc.riotId !== riotId);
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
            }
        }

        function updateRankDistribution(allAccounts) {
            const tiers = Object.keys(tierIcons).filter(t => t !== 'Unranked').concat(['Unranked']);
            const counts = {};
            tiers.forEach(t => counts[t] = 0);

            allAccounts.forEach(acc => {
                const soloTier = acc.soloq && acc.soloq.tier ? acc.soloq.tier.split(' ')[0] : 'Unranked';
                if (counts[soloTier] !== undefined) counts[soloTier]++;
                else counts['Unranked']++;
            });

            rankStatsContainer.innerHTML = '';
            tiers.forEach(t => {
                const count = counts[t];
                if (count === 0 && t === 'Unranked') return;
                const row = document.createElement('div');
                row.style.cssText = 'display: flex; align-items: center; justify-content: space-between; font-size: 11px; margin-bottom: 3px;';
                row.innerHTML = `
                    <span style="color: #94a3b8; width: 75px;">${t}</span>
                    <div style="flex-grow: 1; margin: 0 8px; background: #161821; height: 4px; border-radius: 2px; overflow: hidden;">
                        <div style="background: #3b82f6; width: ${allAccounts.length > 0 ? (count / allAccounts.length) * 100 : 0}%; height: 100%;"></div>
                    </div>
                    <span style="color: #fff; font-weight: bold; width: 15px; text-align: right;">${count}</span>
                `;
                rankStatsContainer.appendChild(row);
            });
        }

        function renderCard(account) {
            const newCard = document.createElement('div');
            newCard.className = 'account-card';
            
            const soloq = account.soloq || { tier: 'Unranked', lp: 0 };
            const flex = account.flex || { tier: 'Unranked', lp: 0 };
            const region = (account.region || 'euw').toUpperCase();
            const mainTierBase = soloq.tier.split(' ')[0];
            const iconUrl = tierIcons[mainTierBase] || tierIcons['Unranked'];
            const lpPercent = Math.min(Math.max((soloq.lp / 100) * 100, 0), 100);

            newCard.innerHTML = `
                <div style="display: flex; gap: 12px; align-items: center;">
                    <img src="${iconUrl}" alt="${soloq.tier}" class="neon-icon" style="width: 52px; height: 52px; min-width: 52px; min-height: 52px; object-fit: contain;">
                    <div style="flex-grow: 1; overflow: hidden;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <h3 class="name" style="margin: 0; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${account.riotId}">${account.riotId}</h3>
                            <span style="font-size: 10px; color: #38bdf8; background: rgba(56,189,248,0.1); padding: 1px 5px; border-radius: 4px; font-weight: bold;">${region}</span>
                        </div>
                        <div style="font-size: 11px; color: #6b6c75; margin-top: 2px;">${t('level')}: <strong style="color: #94a3b8;">${account.level || '30'}</strong></div>
                    </div>
                </div>

                <div class="ranks-container" style="margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
                        <span style="font-size: 13px; font-weight: bold; color: #e2e8f0;">Solo/Duo: ${soloq.tier}</span>
                        <span style="font-size: 11px; color: #38bdf8; font-weight: bold;">${soloq.lp} LP</span>
                    </div>
                    <div style="background: #1e2029; height: 4px; border-radius: 2px; overflow: hidden; margin-bottom: 8px;">
                        <div style="background: linear-gradient(90deg, #3b82f6, #60a5fa); width: ${lpPercent}%; height: 100%;"></div>
                    </div>
                    <div style="font-size: 11px; color: #6b6c75;">${t('flex')}: <strong style="color: #94a3b8;">${flex.tier} (${flex.lp} LP)</strong></div>
                </div>

                <div style="margin-top: 10px;">
                    <input type="text" class="note-input" placeholder="${t('addNote')}" value="${account.note || ''}" data-riotid="${account.riotId}">
                </div>

                <div class="card-actions" style="margin-top: 12px; display: flex; gap: 8px; border-top: 1px solid #1f2029; padding-top: 10px;">
                    <button class="btn-login" style="flex-grow: 1; padding: 7px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s;">${t('loginBtn')}</button>
                    <button class="btn-delete" title="${t('deleteTitle')}" style="background: #161821; border: 1px solid #232430; padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;">🗑️</button>
                </div>
            `;

            newCard.querySelector('.note-input').addEventListener('input', (e) => {
                updateAccountNote(account.riotId, e.target.value);
            });

            newCard.querySelector('.btn-login').addEventListener('click', () => {
                triggerLogin(account.loginUser || account.riotId, account.password);
            });

            newCard.querySelector('.btn-delete').addEventListener('click', () => {
                if (confirm(`${t('deleteConfirm')} ${account.riotId}?`)) {
                    deleteAccount(account.riotId);
                }
            });

            mainContent.appendChild(newCard);
        }

        function updateAccountNote(riotId, noteText) {
            if (fs.existsSync(dataPath)) {
                let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
                const acc = accounts.find(a => a.riotId === riotId);
                if (acc) {
                    acc.note = noteText;
                    fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                }
            }
        }

        function loadAccounts() {
            if (fs.existsSync(dataPath)) {
                try {
                    const data = fs.readFileSync(dataPath, 'utf-8');
                    let allAccounts = JSON.parse(data);
                    
                    updateRankDistribution(allAccounts);

                    const searchTerm = searchInput.value.toLowerCase();
                    const selectedRegion = filterRegion.value;
                    const sortBy = sortSelect.value;

                    let filteredAccounts = allAccounts.filter(acc => {
                        const matchesSearch = acc.riotId.toLowerCase().includes(searchTerm) || (acc.loginUser && acc.loginUser.toLowerCase().includes(searchTerm)) || (acc.note && acc.note.toLowerCase().includes(searchTerm));
                        const matchesRegion = selectedRegion === 'all' || (acc.region || 'euw').toLowerCase() === selectedRegion;
                        return matchesSearch && matchesRegion;
                    });

                    filteredAccounts.sort((a, b) => {
                        if (sortBy === 'rank') {
                            const tierA = a.soloq && a.soloq.tier ? a.soloq.tier.split(' ')[0] : 'Unranked';
                            const tierB = b.soloq && b.soloq.tier ? b.soloq.tier.split(' ')[0] : 'Unranked';
                            const weightA = rankWeights[tierA] !== undefined ? rankWeights[tierA] : 0;
                            const weightB = rankWeights[tierB] !== undefined ? rankWeights[tierB] : 0;
                            if (weightA !== weightB) return weightB - weightA;
                            const lpA = a.soloq ? a.soloq.lp : 0;
                            const lpB = b.soloq ? b.soloq.lp : 0;
                            return lpB - lpA;
                        } else {
                            return a.riotId.localeCompare(b.riotId);
                        }
                    });

                    mainContent.innerHTML = '';
                    filteredAccounts.forEach(acc => renderCard(acc)); 
                } catch (e) {
                    console.error("Error leyendo accounts.json", e);
                }
            } else {
                updateRankDistribution([]);
            }
        }

        async function refreshRanksFromDeeplol() {
            if (!fs.existsSync(dataPath)) return;
            let accounts = JSON.parse(fs.readFileSync(dataPath, 'utf-8'));
            let updated = false;
            if (accounts.length === 0) return;

            for (let acc of accounts) {
                try {
                    const parts = acc.riotId.split('#');
                    if (parts.length < 2) continue;
                    
                    const nameClean = parts[0].trim().toLowerCase();
                    const tagClean = parts[1].trim().toLowerCase();
                    const targetUrl = `https://www.deeplol.gg/summoner/${(acc.region || 'euw').toLowerCase()}/${encodeURIComponent(nameClean)}-${encodeURIComponent(tagClean)}`;
                    
                    const ghostWindow = new BrowserWindow({ show: false, webPreferences: { nodeIntegration: false, contextIsolation: true } });
                    await ghostWindow.loadURL(targetUrl);

                    const scrapedData = await ghostWindow.webContents.executeJavaScript(`
                        (async () => {
                            for (let i = 0; i < 30; i++) {
                                const bodyText = document.body.innerText;
                                if (bodyText.includes("Level") || bodyText.includes("Nivel") || bodyText.includes("LP") || bodyText.includes("Unranked") || bodyText.includes("Silver") || bodyText.includes("Gold")) {
                                    break;
                                }
                                await new Promise(r => setTimeout(r, 500));
                            }
                            await new Promise(r => setTimeout(r, 1500));

                            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                            let textNodes = [];
                            let node;
                            while(node = walker.nextNode()) {
                                const val = node.nodeValue.trim();
                                if (val.length > 0) textNodes.push(val);
                            }

                            let level = "30";
                            for (let i = 0; i < textNodes.length; i++) {
                                if (textNodes[i].toLowerCase() === "level" || textNodes[i].toLowerCase() === "lvl" || textNodes[i].toLowerCase() === "nivel") {
                                    if (textNodes[i+1] && /^\\d+$/.test(textNodes[i+1])) {
                                        level = textNodes[i+1];
                                        break;
                                    }
                                }
                            }
                            if (level === "30") {
                                for (let t of textNodes) {
                                    if (/^\\d{2,3}$/.test(t) && parseInt(t) >= 30 && parseInt(t) <= 1000) {
                                        level = t;
                                        break;
                                    }
                                }
                            }

                            const validTiers = ["Challenger", "Grandmaster", "Master", "Diamond", "Emerald", "Platinum", "Gold", "Silver", "Bronze", "Iron"];

                            function getQueueInfo(queueKeywords) {
                                let tier = "Unranked", div = "", lp = 0;
                                let qIndex = -1;
                                
                                for (let idx = 0; idx < textNodes.length; idx++) {
                                    const tLower = textNodes[idx].toLowerCase();
                                    if (queueKeywords.some(kw => tLower.includes(kw))) {
                                        qIndex = idx;
                                        break;
                                    }
                                }

                                if (qIndex === -1) return { tier: "Unranked", lp: 0 };

                                for (let i = qIndex; i < Math.min(qIndex + 35, textNodes.length); i++) {
                                    const txt = textNodes[i];
                                    
                                    for (let vt of validTiers) {
                                        if (txt.toLowerCase() === vt.toLowerCase() || txt.toLowerCase().startsWith(vt.toLowerCase() + " ")) {
                                            tier = vt;
                                            const subParts = txt.split(/\\s+/);
                                            if (subParts[1] && /^[1-4]$/.test(subParts[1])) {
                                                div = subParts[1];
                                            }
                                        }
                                    }

                                    if (tier !== "Unranked" && !div && /^[1-4]$/.test(txt)) {
                                        div = txt;
                                    }

                                    if (txt.toUpperCase().includes("LP") || txt === "LP") {
                                        const match = txt.match(/(\\d+)\\s*LP/i);
                                        if (match) {
                                            const parsedLp = parseInt(match[1]);
                                            if (parsedLp >= 0 && parsedLp <= 100) {
                                                lp = parsedLp;
                                                break;
                                            }
                                        } else if (i > 0 && /^\\d+$/.test(textNodes[i-1])) {
                                            const candidateLp = parseInt(textNodes[i-1]);
                                            if (candidateLp >= 0 && candidateLp <= 100) {
                                                lp = candidateLp;
                                                break;
                                            }
                                        }
                                    }
                                }

                                const finalTier = ["Master", "Grandmaster", "Challenger"].includes(tier) 
                                    ? tier 
                                    : (div ? \`\${tier} \${div}\` : (tier !== "Unranked" ? \`\${tier} 4\` : "Unranked"));

                                return { tier: finalTier, lp };
                            }

                            return { 
                                level, 
                                solo: getQueueInfo(["solo", "duo", "ranked solo"]), 
                                flex: getQueueInfo(["flex", "ranked flex"]) 
                            };
                        })()
                    `);
                    
                    ghostWindow.close();
                    
                    if (scrapedData) {
                        acc.level = scrapedData.level;
                        acc.soloq = scrapedData.solo;
                        acc.flex = scrapedData.flex;
                        updated = true;
                    }
                } catch (e) {}
            }

            if (updated) {
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
                showNeonNotification(t('syncMsg'));
            }
        }

        btnAdd.addEventListener('click', () => modal.style.display = 'flex');
        btnClose.addEventListener('click', () => modal.style.display = 'none');
        btnSettings.addEventListener('click', () => {
            dataPathLabel.textContent = dataPath;
            accountsCountLabel.textContent = fs.existsSync(dataPath) ? JSON.parse(fs.readFileSync(dataPath, 'utf-8')).length : 0;
            settingsModal.style.display = 'flex';
        });
        btnCloseSettings.addEventListener('click', () => settingsModal.style.display = 'none');
        btnOpenFolder.addEventListener('click', () => shell.showItemInFolder(dataPath));

        btnExport.addEventListener('click', async () => {
            const res = await dialog.showSaveDialog({ defaultPath: 'accounts-backup.json', filters: [{ name: 'JSON', extensions: ['json'] }] });
            if (!res.canceled && res.filePath && fs.existsSync(dataPath)) fs.copyFileSync(dataPath, res.filePath);
        });

        btnImport.addEventListener('click', async () => {
            const res = await dialog.showOpenDialog({ filters: [{ name: 'JSON', extensions: ['json'] }], properties: ['openFile'] });
            if (!res.canceled && res.filePaths.length > 0) {
                try {
                    fs.writeFileSync(dataPath, fs.readFileSync(res.filePaths[0], 'utf-8'));
                    loadAccounts();
                } catch(e){}
            }
        });

        btnSave.addEventListener('click', () => {
            const loginUser = inputLoginUser.value.trim();
            const riotId = inputRiotId.value.trim();
            const region = inputRegion.value;
            const password = inputPassword.value.trim();
            if (loginUser && riotId && password) {
                let accounts = fs.existsSync(dataPath) ? JSON.parse(fs.readFileSync(dataPath, 'utf-8')) : [];
                accounts = accounts.filter(a => a.riotId !== riotId);
                accounts.push({ loginUser, riotId, region, password, soloq: {tier:"Unranked", lp:0}, flex:{tier:"Unranked", lp:0}, level: "30", note: "" });
                fs.writeFileSync(dataPath, JSON.stringify(accounts, null, 4));
                loadAccounts();
                modal.style.display = 'none';
                inputLoginUser.value = ''; inputRiotId.value = ''; inputPassword.value = '';
                refreshRanksFromDeeplol();
            }
        });

        searchInput.addEventListener('input', loadAccounts);
        filterRegion.addEventListener('change', loadAccounts);
        sortSelect.addEventListener('change', loadAccounts);
        
        applyLanguage();

        // Control de cuenta atrás del Auto Refresh (Configurado a 30 segundos para comprobación)
        // Para cambiarlo a 30 minutos reales más adelante, cambia '30' por '(30 * 60)'
        const REFRESH_INTERVAL_SECONDS = 30; 
        
        let lastRefreshTime = localStorage.getItem('last_refresh_timestamp');
        let currentTimeEpoch = Math.floor(Date.now() / 1000);
        let secondsPassed = lastRefreshTime ? (currentTimeEpoch - parseInt(lastRefreshTime)) : REFRESH_INTERVAL_SECONDS;
        let totalSecondsRemaining = Math.max(0, REFRESH_INTERVAL_SECONDS - secondsPassed);

        if (totalSecondsRemaining === 0) {
            refreshRanksFromDeeplol();
            localStorage.setItem('last_refresh_timestamp', Math.floor(Date.now() / 1000));
        }

        setInterval(() => {
            totalSecondsRemaining--;
            if (totalSecondsRemaining <= 0) {
                refreshRanksFromDeeplol();
                localStorage.setItem('last_refresh_timestamp', Math.floor(Date.now() / 1000));
                totalSecondsRemaining = REFRESH_INTERVAL_SECONDS;
            }
            
            if (totalSecondsRemaining >= 60) {
                const minutesLeft = Math.ceil(totalSecondsRemaining / 60);
                autoRefreshTimerLabel.textContent = `Next refresh ${minutesLeft} min`;
            } else {
                autoRefreshTimerLabel.textContent = `Next refresh ${totalSecondsRemaining}s`;
            }
        }, 1000);
    </script>
</body>
