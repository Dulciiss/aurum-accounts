<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Accounts</title>
    <!-- Importamos la tipografía Cinzel estilo LoL desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="titlebar" id="titlebar">
        <div class="titlebar-brand"></div>
        <div class="titlebar-controls">
            <button class="tb-btn" id="tb-min" data-i18n-aria-label="winMinimize" data-i18n-title="winMinimize">
                <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="tb-btn" id="tb-max">
                <svg class="icon-maximize" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5V0.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="tb-btn close" id="tb-close" data-i18n-aria-label="winClose" data-i18n-title="winClose">
                <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
            </button>
        </div>
    </header>

    <div class="app-shell">
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="logo.svg" alt="">
            <span class="sidebar-brand-name">Aurum Accounts</span>
        </div>

        <button class="btn-add sb-add">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="addAccountBtn"></span>
            <kbd>Ctrl N</kbd>
        </button>

        <div class="sb-panel">
            <div class="sb-label" data-i18n="rankDistribution"></div>
            <div id="rank-stats-container"></div>
        </div>

        <div id="auto-refresh-box" class="sb-refresh" data-i18n-title="refreshNowTip">
            <div class="sb-refresh-ring"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg></div>
            <div class="sb-refresh-text">
                <span class="sb-refresh-label" data-i18n="autoRefreshLabel"></span>
                <span id="auto-refresh-timer"></span>
            </div>
        </div>

        <div class="spacer" style="flex-grow: 1;"></div>

        <nav class="sb-nav">
            <button class="sb-nav-item" id="btn-import"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="navImport"></span></button>
            <button class="sb-nav-item" id="btn-export"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg><span data-i18n="navExport"></span></button>
            <button class="sb-nav-item" id="btn-data-folder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span data-i18n="navDataFolder"></span></button>
            <button class="sb-nav-item btn-menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="navSettings"></span></button>
        </nav>
        <div class="sb-version" id="sb-version"></div>
    </div>
    
    <div class="content-wrapper" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="app-header topbar">
            <div class="tb-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" spellcheck="false">
                <kbd>Ctrl F</kbd>
            </div>

            <div class="tb-controls">
                <label class="tb-pill">
                    <span class="tb-pill-label" data-i18n="selRegionLabel"></span>
                    <select id="filter-region"></select>
                    <svg class="tb-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </label>

                <label class="tb-pill">
                    <span class="tb-pill-label" data-i18n="selSortLabel"></span>
                    <select id="sort-select">
                        <option value="rank" data-i18n="selRank"></option>
                        <option value="name" data-i18n="selName"></option>
                    </select>
                    <svg class="tb-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </label>

                <div style="position: relative;">
                    <button id="lang-btn" class="tb-icon-btn" data-i18n-title="langTip">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                    </button>
                    <div id="lang-dropdown" class="lang-dropdown">
                        <button class="lang-option" data-lang="es">Español</button>
                        <button class="lang-option" data-lang="en">English</button>
                        <button class="lang-option" data-lang="fr">Français</button>
                        <button class="lang-option" data-lang="de">Deutsch</button>
                        <button class="lang-option" data-lang="pt">Português</button>
                        <button class="lang-option" data-lang="ru">Русский</button>
                        <button class="lang-option" data-lang="tr">Türkçe</button>
                        <button class="lang-option" data-lang="zh">中文</button>
                        <button class="lang-option" data-lang="ja">日本語</button>
                        <button class="lang-option" data-lang="ko">한국어</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content" style="overflow-y: auto; padding: 30px; flex-grow: 1; background: #07080a;">
        </div>
    </div>
    </div><!-- /.app-shell -->

    <!-- Modales -->
    <!-- Panel lateral: añadir / editar cuenta -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="account-drawer" class="account-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
        <div class="drawer-head">
            <h3 id="drawer-title" data-i18n="drawerAddTitle"></h3>
            <p class="drawer-sub" data-i18n="drawerSub"></p>
            <button class="settings-x" id="drawer-close" data-i18n-aria-label="closeBtn">✕</button>
        </div>

        <div class="drawer-body">
            <div class="drawer-tabs" id="drawer-tabs">
                <button type="button" class="drawer-tab active" data-tab="single" data-i18n="tabSingle"></button>
                <button type="button" class="drawer-tab" data-tab="bulk" data-i18n="tabBulk"></button>
            </div>

            <!-- Una cuenta -->
            <div id="tab-single">
                <div class="field">
                    <label for="acc-login-user" data-i18n="fieldLoginUser"></label>
                    <input type="text" id="acc-login-user" data-i18n-placeholder="loginUserPh" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                    <label for="acc-riot-id"><span data-i18n="fieldRiotId"></span> <em data-i18n="optional"></em></label>
                    <input type="text" id="acc-riot-id" data-i18n-placeholder="riotIdPh" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                    <label for="acc-region" data-i18n="regionLabel"></label>
                    <select id="acc-region"></select>
                </div>
                <div class="field">
                    <label for="acc-password" data-i18n="fieldPassword"></label>
                    <div class="password-wrap">
                        <input type="password" id="acc-password" autocomplete="new-password">
                        <button type="button" class="eye-btn" id="toggle-password" data-i18n-aria-label="showPassword">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label for="acc-description"><span data-i18n="fieldDescription"></span> <em data-i18n="optional"></em></label>
                    <input type="text" id="acc-description" data-i18n-placeholder="descriptionPh" maxlength="80">
                </div>
                <div class="field-error" id="single-error"></div>
                <button type="button" class="btn-gold" id="drawer-submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    <span id="drawer-submit-label" data-i18n="addAccountBtn"></span>
                </button>
            </div>

            <!-- Carga masiva -->
            <div id="tab-bulk" style="display: none;">
                <div class="field">
                    <label for="bulk-text" data-i18n="bulkLabel"></label>
                    <textarea id="bulk-text" spellcheck="false" data-i18n-placeholder="bulkPh"></textarea>
                    <div class="field-hint" data-i18n="bulkHint"></div>
                </div>
                <div class="field">
                    <label for="bulk-region" data-i18n="bulkDefaultRegion"></label>
                    <select id="bulk-region"></select>
                </div>
                <div class="field-error" id="bulk-error"></div>
                <button type="button" class="btn-gold" id="bulk-submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    <span data-i18n="bulkSubmit"></span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Pantalla de inicio de sesión -->
    <div id="login-overlay" class="login-overlay" aria-hidden="true">
        <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-live="polite">
            <div class="login-emblem">
                <svg class="login-rings" viewBox="0 0 200 200" aria-hidden="true">
                    <circle class="ring-track" cx="100" cy="100" r="94"/>
                    <circle class="ring-track" cx="100" cy="100" r="82"/>
                    <g class="ring-spin"><circle class="ring-arc green" cx="100" cy="100" r="94" stroke-dasharray="150 441"/></g>
                    <g class="ring-spin reverse"><circle class="ring-arc gold" cx="100" cy="100" r="82" stroke-dasharray="190 325"/></g>
                    <circle class="ring-full" cx="100" cy="100" r="94"/>
                    <circle class="ring-full" cx="100" cy="100" r="82"/>
                </svg>
                <div class="login-core"><img id="login-emblem-img" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"></div>
            </div>
            <h2 class="login-title" id="login-title"></h2>
            <div class="login-account" id="login-account"></div>
            <div class="login-bar"><div class="login-bar-fill" id="login-bar-fill"></div></div>
            <ul class="login-steps" id="login-steps"></ul>
            <div class="login-footer-text" id="login-footer-text"></div>
            <div class="login-actions">
                <button type="button" class="settings-cancel" id="login-btn-retry"></button>
                <button type="button" class="settings-cancel" id="login-btn-cancel"></button>
                <button type="button" class="settings-save" id="login-btn-close"></button>
            </div>
        </div>
    </div>

    <!-- Menú contextual de las tarjetas -->
    <div id="card-menu" class="ctx-menu" role="menu">
        <button class="ctx-item" data-action="opgg" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
            <span data-i18n="ctxOpgg"></span>
        </button>
        <button class="ctx-item" data-action="edit" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
            <span data-i18n="ctxEdit"></span>
        </button>
        <div class="ctx-sep"></div>
        <button class="ctx-item danger" data-action="delete" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span data-i18n="ctxDelete"></span>
            <span class="ctx-kbd">Del</span>
        </button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-head">
                <h3 id="settings-title" data-i18n="settingsTitle"></h3>
                <button class="settings-x" id="settings-x" data-i18n-aria-label="closeBtn">✕</button>
            </div>

            <div class="settings-body">
                <!-- GENERAL -->
                <div class="settings-section">
                    <div class="settings-section-title" data-i18n="setGeneral"></div>

                    <div class="setting-row">
                        <div class="setting-text"><span class="setting-name" data-i18n="setLanguage"></span></div>
                        <select id="set-language" class="settings-select">
                            <option value="es">Español</option>
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="pt">Português</option>
                            <option value="ru">Русский</option>
                            <option value="tr">Türkçe</option>
                            <option value="zh">中文</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <div class="setting-text">
                            <span class="setting-name" data-i18n="setLaunchAtStartup"></span>
                            <span class="setting-desc" data-i18n="setLaunchAtStartupDesc"></span>
                        </div>
                        <label class="switch"><input type="checkbox" id="set-launch-startup"><span class="track"></span></label>
                    </div>

                    <div class="setting-row">
                        <div class="setting-text">
                            <span class="setting-name" data-i18n="setStartMinimized"></span>
                            <span class="setting-desc" data-i18n="setStartMinimizedDesc"></span>
                        </div>
                        <label class="switch"><input type="checkbox" id="set-start-minimized"><span class="track"></span></label>
                    </div>
                </div>

                <!-- ACTUALIZACIÓN DE RANGOS -->
                <div class="settings-section">
                    <div class="settings-section-title" data-i18n="setRankUpdates"></div>

                    <div class="setting-row">
                        <div class="setting-text"><span class="setting-name" data-i18n="setAutoRefresh"></span></div>
                        <label class="switch"><input type="checkbox" id="set-auto-refresh"><span class="track"></span></label>
                    </div>

                    <div id="interval-block">
                        <div class="setting-row interval-row">
                            <span class="setting-name" data-i18n="setRefreshEvery"></span>
                            <div class="preset-group" id="preset-group">
                                <button type="button" class="preset-btn" data-min="5">5</button>
                                <button type="button" class="preset-btn" data-min="15">15</button>
                                <button type="button" class="preset-btn" data-min="30">30</button>
                                <button type="button" class="preset-btn" data-min="60">60</button>
                                <button type="button" class="preset-btn" data-min="120">120</button>
                            </div>
                            <div class="minutes-box">
                                <input type="number" id="set-refresh-minutes" class="minutes-input" min="5" max="1440" step="1">
                                <span data-i18n="unitMin"></span>
                            </div>
                        </div>
                        <div class="setting-hint" data-i18n="setRefreshHint"></div>
                    </div>
                </div>

                <!-- INICIO DE SESIÓN -->
                <div class="settings-section">
                    <div class="settings-section-title" data-i18n="setLogin"></div>

                    <label class="radio-option">
                        <input type="radio" name="login-mode" value="riotClient">
                        <span class="radio-dot"></span>
                        <span class="setting-text">
                            <span class="setting-name" data-i18n="setLoginRiot"></span>
                            <span class="setting-desc" data-i18n="setLoginRiotDesc"></span>
                        </span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="login-mode" value="previousWindow">
                        <span class="radio-dot"></span>
                        <span class="setting-text">
                            <span class="setting-name" data-i18n="setLoginPrev"></span>
                            <span class="setting-desc" data-i18n="setLoginPrevDesc"></span>
                        </span>
                    </label>

                    <div class="setting-row">
                        <div class="setting-text">
                            <span class="setting-name" data-i18n="setLaunchGame"></span>
                            <span class="setting-desc" data-i18n="setLaunchGameDesc"></span>
                        </div>
                        <label class="switch"><input type="checkbox" id="set-launch-game"><span class="track"></span></label>
                    </div>
                </div>

                <!-- DATOS -->
                <div class="settings-section">
                    <div class="settings-section-title" data-i18n="setData"></div>
                    <div class="setting-row">
                        <div class="setting-text">
                            <span class="setting-name"><span data-i18n="savedAccountsLabel"></span> <span id="accounts-count-label">0</span></span>
                            <span class="data-path" id="data-path-label"></span>
                        </div>
                        <button id="btn-open-folder" class="settings-ghost-btn" data-i18n="openFolderBtn"></button>
                    </div>
                </div>

                <!-- ACTUALIZACIONES -->
                <div class="settings-section">
                    <div class="settings-section-title" data-i18n="setUpdates"></div>

                    <div class="setting-row">
                        <div class="setting-text"><span class="setting-name" data-i18n="setAutoUpdates"></span></div>
                        <label class="switch"><input type="checkbox" id="set-auto-updates"><span class="track"></span></label>
                    </div>

                    <div class="setting-row">
                        <span class="setting-name" style="font-weight: 500;"><span data-i18n="setInstalledVersion"></span> <span id="app-version-label"></span></span>
                        <button type="button" id="btn-check-updates" class="settings-ghost-btn">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                                <path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                            </svg>
                            <span data-i18n="setCheckNow"></span>
                        </button>
                    </div>
                    <div class="update-status" id="update-status"></div>
                </div>
            </div>

            <div class="settings-foot">
                <button id="close-settings" class="settings-cancel" data-i18n="cancelBtn"></button>
                <button id="save-settings" class="settings-save" data-i18n="saveBtn"></button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal">
        <div class="modal-content" style="width: 340px; text-align: center;">
            <h3 data-i18n="deleteTitle" style="color: #ef4444; margin-bottom: 10px;"></h3>
            <p id="confirm-text" style="font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; font-family: 'Cinzel', sans-serif;"></p>
            <div style="display: flex; gap: 10px;">
                <button id="confirm-yes" style="flex: 1; padding: 10px; background: #ef4444; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Cinzel', sans-serif;" data-i18n="acceptBtn"></button>
                <button id="confirm-no" style="flex: 1; padding: 10px; background: #1e2029; border: 1px solid #334155; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Cinzel', sans-serif;" data-i18n="cancelBtn"></button>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
