<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 4 468 468" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2aa"/><stop offset="0.5" stop-color="#c9a85c"/><stop offset="1" stop-color="#6e5424"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8fff6"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="262" r="210" fill="url(#halo)"/>
  <!-- alas (izquierda; la derecha es su reflejo) -->
  <g id="wing" fill="url(#gold)">
    <path d="M196 250 L52 150 L104 238 L34 226 L108 296 L52 318 L180 312 Z"/>
    <path d="M184 340 L88 372 L190 380 Z" opacity="0.85"/>
  </g>
  <use href="#wing" transform="translate(512 0) scale(-1 1)"/>
  <!-- marco del cristal -->
  <polygon points="256,72 352,262 256,452 160,262" fill="#0b0c10" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
  <!-- cristal de rango facetado -->
  <g filter="url(#glow)">
    <polygon points="256,116 256,262 196,262" fill="url(#gemL)"/>
    <polygon points="256,116 316,262 256,262" fill="url(#gemR)"/>
    <polygon points="196,262 256,262 256,408" fill="#1e40af"/>
    <polygon points="256,262 316,262 256,408" fill="#2563eb"/>
  </g>
  <!-- corona -->
  <path d="M232 70 L256 24 L280 70 Z" fill="url(#gold)"/>
</svg>
