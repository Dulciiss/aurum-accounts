name: Limpiar versiones (uso manual)

# Borra releases y etiquetas concretas. Se ejecuta a mano desde la pestaña Actions -> "Run workflow".
# Sirve para empezar de cero con las versiones. Puedes borrar este archivo cuando ya no lo necesites.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Etiquetas a borrar, separadas por espacios (por ejemplo: v1.0.1 v1.0.3 v1.0.4)'
        required: true
        type: string
      confirm:
        description: 'Escribe BORRAR para confirmar'
        required: true
        type: string

permissions:
  contents: write   # necesario para borrar releases y etiquetas

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar releases y etiquetas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "BORRAR" ]; then
            echo "::error::Para confirmar hay que escribir BORRAR (en mayúsculas)."
            exit 1
          fi
          for TAG in $TAGS; do
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Etiqueta no válida: $TAG (debe ser como v1.0.1)"
              exit 1
            fi
          done
          for TAG in $TAGS; do
            echo "--- $TAG"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes && echo "Release y etiqueta borradas."
            elif gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --silent; then
              echo "Etiqueta borrada (no tenía release)."
            else
              echo "::warning::No se encontró $TAG (ni release ni etiqueta)."
            fi
          done
