name: Release

# Se ejecuta al subir una etiqueta de versión (v1.0.1, v1.1.0...). Compila en Windows y publica la release
# con el instalador, el Portable y los archivos que usa la actualización automática (latest.yml...).
# La release queda como borrador hasta que todos los archivos están subidos y entonces se publica sola.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necesario para crear la release y subir los archivos

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar que la etiqueta coincide con la versión de package.json
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "::error::La etiqueta ($GITHUB_REF_NAME) no coincide con la versión de package.json ($PKG). Cambia 'version' en package.json y vuelve a etiquetar."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar certificado de firma opcional
        shell: pwsh
        env:
          WINDOWS_CSC_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CSC_CERTIFICATE_BASE64 }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CSC_CERTIFICATE_BASE64) {
            Write-Host "No hay certificado Authenticode configurado; los ejecutables se compilarán sin firma."
            exit 0
          }
          if (-not $env:WINDOWS_CSC_KEY_PASSWORD) {
            throw "WINDOWS_CSC_KEY_PASSWORD is required when a signing certificate is configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "aurum-accounts-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CSC_CERTIFICATE_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "CSC_LINK=$certificatePath" >> $env:GITHUB_ENV

      # electron-builder sube todo a un BORRADOR (releaseType: draft en package.json). Así nadie, ni la
      # actualización automática, ve una release a medias mientras se compila o si algo falla por el camino.
      - name: Compilar y subir los archivos (borrador)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Eliminar certificado temporal
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "aurum-accounts-signing.pfx"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }

      - name: Publicar la release (ya con todos los archivos subidos)
        shell: bash
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n 1)
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false
            echo "Release $GITHUB_REF_NAME publicada."
          elif gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --silent; then
            # Si package.json tiene "releaseType": "release", electron-builder ya la publicó: no hay nada que hacer
            echo "La release $GITHUB_REF_NAME ya estaba publicada."
          else
            echo "::error::No se encontró la release $GITHUB_REF_NAME (ni como borrador ni publicada)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
